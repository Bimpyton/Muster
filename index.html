function gearBlock(u,e,ro){
  const sl=u.gearSlots||[],notes=u.gearNotes||[];if(!sl.length&&!notes.length)return '';
  const gs=e.gs||{};const n=tierSize(u,e);const changed=Object.keys(gs).length>0;
  const sb=(id,k,d,dis,lab)=>`<button class="btn sm ghost" style="min-height:24px;padding:0 6px" data-a="gsN" data-id="${id}" data-k="${k}" data-n="${d}" ${dis?'disabled':''} aria-label="${lab}">${d>0?'+':'−'}</button>`;
  return `<details class="gear" data-gid="${e.id}" ${S.gearOpen[e.id]?'open':''}><summary class="small">Wargear options · ${changed?h(gearPicks(u,e).join(', ')||'default'):'default loadout'}</summary><div class="stack" style="gap:12px;margin-top:8px">
    ${sl.map((s,i)=>{if(s.kind==='one'){const v=gs[i]??-1;
      const nm='g-'+e.id+'-'+i;const opts=[[-1,s.add?'None':((s.from||[]).join(' + ')||'Default')],...s.choices.map((c,j)=>[j,c.join(' + ')])];
      return `<div class="gslot"><p class="small">${h(s.text||'Option')}</p><div class="radios" role="radiogroup">${opts.map(([j,lab])=>`<label><input type="radio" name="${nm}" value="${j}" data-c="gs1" data-id="${e.id}" data-k="${i}" ${+v===j?'checked':''} ${ro?'disabled':''}>${h(lab)}</label>`).join('')}</div></div>`}
      const mx=slotMax(s,n);const cur=gs[i]||{};const tot=Object.values(cur).reduce((a,b)=>a+ +b,0);
      return `<div class="gslot"><p class="small">${h(s.text||'Options')} <span class="muted num">${tot}/${mx}</span></p><div class="row">${s.choices.map((c,j)=>{const k=+(cur[j]||0);const nm=c.join(' + ');
        return `<span class="tag" style="gap:6px">${h(nm)}${ro?` ×${k}`:` ${sb(e.id,i+':'+j,-1,k<=0,'Fewer '+h(nm))}<span class="num">${k}</span>${sb(e.id,i+':'+j,1,tot>=mx,'More '+h(nm))}`}</span>`}).join('')}</div></div>`}).join('')}
    ${notes.length?`<ul class="small muted" style="margin:0;padding-left:18px">${notes.map(x=>`<li>${h(x)}</li>`).join('')}</ul>`:''}
    ${changed&&!ro?`<button class="btn sm ghost" style="justify-self:start" data-a="gearReset" data-id="${e.id}">Reset to default loadout</button>`:''}</div></details>`}
function backTo(v,msg){S.view=v;setTimeout(()=>{toast(msg);render()},0);return ''}

function vPlayPick(){

function gearPicks(u,e){const out=[];const gs=e.gs||{};(u.gearSlots||[]).forEach((s,i)=>{const v=gs[i];if(v==null)return;
  if(s.kind==='one'){const c=s.choices[+v];if(c)out.push(c.join(' + '))}else for(const[ci,c]of Object.entries(v||{}))if(+c>0&&s.choices[ci])out.push(`${c}× ${s.choices[ci].join(' + ')}`)});return out}
function datasheet(u,gear){
  const f=w=>!gear||gear.has(baseW(w.name));

  return `${statlines(u)}${weaponTables(v)}`;
}

/* search */
function buildIndex(){
  const ix=[];const add=(g,t,sub,k,id,n,text)=>ix.push({g,t,sub,k,id,n,s:(t+' '+(sub||'')+' '+(text||'')).toLowerCase()});
  for(const sec of CORE_RULES){add('Core rules',sec.title,'Section '+sec.num,'rule',sec.id,'rule-'+sec.id,'');sec.items.forEach(([t,x],i)=>add('Core rules',t,sec.title,'rule',sec.id,`rule-${sec.id}-${i}`,x))}
  for(const x of S.core.stratagems||[])add('Core stratagems',x.name,`${x.cp}CP · ${x.turn}`,'cstrat',x.id,'',x.text);
  for(const[fid,rs]of Object.entries(S.core.armyRules||{}))for(const r of rs)add('Army rules',r.name,FX[fid]?.name,'army',fid,'',r.text);
  for(const[id,u]of Object.entries(S.units))add('Units',u.name,`${FX[u.faction]?.name||''} · ${catOf(u)}`,'unit',id,'',u.keywords);
  for(const[id,d]of Object.entries(S.dets)){add('Detachments',d.name,`${FX[d.faction]?.name||''} · ${d.dp} DP`,'det',id,'',dispsOf(d).join(' '));
    for(const e of d.enhancements||[])add('Enhancements',e.name,`${d.name} · ${e.pts} pts`,'det',id,'enh-'+e.id,e.text);
    for(const x of d.stratagems||[])add('Stratagems',x.name,`${d.name} · ${x.cp}CP`,'det',id,'st-'+x.id,x.text)}
  for(const[id,l]of singles())add('Lists',l.name||'Untitled list',FX[l.faction]?.name,'list',id,'','');
  return ix;
}
function runSearch(q){
  const box=$('#results');q=q.trim().toLowerCase();if(q.length<2){box.hidden=true;box.innerHTML='';return}
  const terms=q.split(/\s+/);const hits=buildIndex().map(x=>{if(!terms.every(t=>x.s.includes(t)))return null;const tl=x.t.toLowerCase();return{...x,score:(tl===q?0:tl.startsWith(q)?1:tl.includes(q)?2:3)}}).filter(Boolean).sort((a,b)=>a.score-b.score||a.t.localeCompare(b.t)).slice(0,40);
  const groups={};hits.forEach(x=>(groups[x.g]||(groups[x.g]=[])).push(x));
  box.innerHTML=hits.length?Object.entries(groups).map(([g,xs])=>`<p class="grp">${h(g)}</p>${xs.map(x=>`<button class="res" data-a="goto" data-k="${x.k}" data-id="${h(x.id)}" data-n="${h(x.n||'')}"><span class="body"><span>${h(x.t)}</span><small>${h(x.sub||'')}</small></span></button>`).join('')}`).join(''):`<p class="small muted" style="padding:10px">No matches for “${h(q)}”.</p>`;
  box.hidden=false;
}
function closeSearch(){const i=$('#gsearch');if(i){i.value='';i.blur()}const b=$('#results');b.hidden=true;b.innerHTML=''}
document.addEventListener('input',e=>{if(e.target.dataset.t&&S.themeDraft){S.themeDraft[e.target.dataset.t]=e.target.value}});
document.addEventListener('input',e=>{if(e.target.id==='gsearch')runSearch(e.target.value)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#results').hidden)closeSearch()});
document.addEventListener('click',e=>{if(!e.target.closest('#searchwrap'))$('#results').hidden=true});
document.addEventListener('focusin',e=>{if(e.target.id==='gsearch'&&e.target.value.trim().length>1)runSearch(e.target.value)});

const fld=(label,path,val,opt={})=>{const id='d-'+path.replace(/\./g,'-');

  if(opt.area)return `<label class="f">${label}<textarea id="${id}" data-d="${path}" rows="${opt.rows||4}">${h(val)}</textarea></label>`;
  return `<label class="f">${label}<input type="${opt.num?'number':'text'}" ${opt.num?'data-num inputmode="numeric"':''} id="${id}" data-d="${path}" value="${h(val)}"></label>`};

      <p class="eyebrow" style="margin-top:6px">Not in Muster? Pick their disposition</p><div class="row">${DISPOSITIONS.map(x=>`<button class="chip disp ${DISP_CLS[x]||''}" data-a="setOppDisp" data-k="${x}">${x}</button>`).join('')}</div>

  }
  el.className='sheet';el.hidden=false;el.innerHTML=`<div class="pane" role="dialog" aria-modal="true">${body}</div>`;

function rosterText(l){
  const c=calc(l);const lines=[`${l.name} — ${FX[l.faction].name} — ${c.pts}/${l.limit} pts`,
    `Detachments: ${c.dets.map(d=>`${d.name} (${d.dp} DP)`).join(', ')||'none'}`,`Force Disposition: ${l.disposition||'—'}`,''];
  for(const e of l.entries||[]){const u=S.units[e.unitId];if(!u)continue;const t=(u.tiers||[])[e.tier||0];const en=findEnh(e.enhId);const host=(l.entries||[]).find(x=>x.id===e.attach);
    const wg=Object.entries(e.wg||{}).filter(([,n])=>+n>0).map(([i,n])=>`${n}× ${u.wargear?.[i]?.name}`);
    lines.push(`• ${u.name}${t?` (${t.label})`:''} — ${c.cost[e.id]} pts${e.warlord?' [Warlord]':''}${en?`\n    ${en.upgrade?'Upgrade':'Enhancement'}: ${en.name} (+${en.pts})`:''}${wg.length?`\n    Wargear: ${wg.join(', ')}`:''}${gearPicks(u,e).length?`\n    Loadout: ${gearPicks(u,e).join(', ')}`:''}${host?`\n    Attached to: ${groupName(l,host)}`:''}`)}
  return lines.join('\n');
}

  return{id:s.id||rid(),name:s.name||'',cp:+s.cp||0,type:STRAT_TYPES.includes(s.type)?s.type:'',phases:ph,turn:TURNS.includes(s.turn)?s.turn:TURNS[0],text:s.text||''}}

  tiers:(u.tiers||[]).map(t=>{const o={label:t.label||'',pts:+t.pts||0};if(b2&&t.pts2!==''&&t.pts2!=null)o.pts2=+t.pts2||0;return o}),band2From:b2,

  models:modelsOf(u).map(m=>Object.fromEntries([['name',String(m.name||'')],...MSTATS.map(k=>[k,String(m[k]??'')])])),
  leader:['Leader','Support'].includes(u.leader)?u.leader:'',leads:leads.map(x=>x.trim()).filter(Boolean),composition:comp.map(x=>x.trim()).filter(Boolean),
  loadout:u.loadout||'',options:Array.isArray(u.options)?u.options:[],defaultGear:Array.isArray(u.defaultGear)?u.defaultGear:[],gearSlots:Array.isArray(u.gearSlots)?u.gearSlots:[],gearNotes:Array.isArray(u.gearNotes)?u.gearNotes:[],

function groupKey(){

async function fbConnect(group){
  const[A,AU,F]=await Promise.all([import(FBV+'firebase-app.js'),import(FBV+'firebase-auth.js'),import(FBV+'firebase-firestore.js')]);
  const app=A.initializeApp(FIREBASE_CONFIG);const auth=AU.getAuth(app);
  await AU.setPersistence(auth,AU.browserLocalPersistence).catch(()=>{});
  if(!auth.currentUser)await AU.signInAnonymously(auth);
  let fs;try{fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache()})}catch(e){fs=F.getFirestore(app)}
  const root='groups/'+group+'/';
  const enc=v=>Array.isArray(v)?(v.some(Array.isArray)?{__json:JSON.stringify(v)}:v.map(enc)):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,enc(x)])):v;
  const dec=v=>Array.isArray(v)?v.map(dec):v&&typeof v==='object'?(typeof v.__json==='string'&&Object.keys(v).length===1?JSON.parse(v.__json):Object.fromEntries(Object.entries(v).map(([k,x])=>[k,dec(x)]))):v;
  const snapOf=x=>({exists:x.exists(),id:x.id,data:()=>dec(x.data())});
  const doc=p=>{const r=F.doc(fs,root+p);return{set:d=>F.setDoc(r,enc(d)),update:d=>F.updateDoc(r,enc(d)),delete:()=>F.deleteDoc(r),get:async()=>snapOf(await F.getDoc(r)),onSnapshot:(cb,err)=>F.onSnapshot(r,x=>cb(snapOf(x)),err)}};
  const collection=c=>({onSnapshot:(cb,err)=>F.onSnapshot(F.collection(fs,root+c),x=>cb({docs:x.docs.map(d=>({id:d.id,data:()=>dec(d.data())}))}),err)});
  const meta=await F.getDoc(F.doc(fs,root+'meta/seed'));
  if(!meta.exists()){toast('Setting up your group for the first time…');
    const seed=await (await fetch('seed.json')).json();const ops=[];
    for(const[c,docs]of Object.entries(seed))for(const[id,d]of Object.entries(docs))ops.push([c+'/'+id,d]);
    for(let k=0;k<ops.length;k+=400){const b=F.writeBatch(fs);for(const[p,d]of ops.slice(k,k+400))b.set(F.doc(fs,root+p),enc(d));await b.commit()}
    await F.setDoc(F.doc(fs,root+'meta/seed'),{at:Date.now()})}
  for(const mig of MIGRATIONS){const mr=F.doc(fs,root+'meta/mig-'+mig);if((await F.getDoc(mr)).exists())continue;
    try{const m=await (await fetch('migrations/'+mig+'.json',{cache:'no-store'})).json();const ops=[];
      for(const[c,docs]of Object.entries(m))for(const[id,d]of Object.entries(docs||{}))ops.push([c==='core'?'core/'+id:c+'/'+id,d]);
      for(let k=0;k<ops.length;k+=400){const b=F.writeBatch(fs);for(const[p,d]of ops.slice(k,k+400))b.set(F.doc(fs,root+p),enc(d),{merge:true});await b.commit()}
      await F.setDoc(mr,{at:Date.now()});toast('Rules updated')}catch(e){console.error('migration',mig,e)}}
  return{db:{doc,collection},uid:auth.currentUser.uid};
}

}
