<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16191d">
<title>Muster</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muster">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first dataslate — sticky header, single column of operable panels, fixed bottom tab bar */
:root{
  --bg:#e9ecef;--surface:#fbfcfd;--surface2:#f1f3f5;--ink:#181c21;--muted:#5a636d;--line:#d3d8de;
  --brass:#8a5f12;--brass-ink:#fff8ea;--brass-soft:#f2e6cc;--danger:#a8261d;--danger-soft:#f8e1de;--ok:#2b6e47;--ok-soft:#dcefe3;
  --display:"Saira Condensed","Arial Narrow",sans-serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
  --a-fill:var(--brass);--a-ink:var(--brass-ink);--a-text:var(--brass);--a-soft:var(--brass-soft);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101317;--surface:#191e24;--surface2:#212830;--ink:#e6e9ec;--muted:#98a2ad;--line:#2d353e;
  --brass:#d9a744;--brass-ink:#1a1408;--brass-soft:#372b14;--danger:#ef7468;--danger-soft:#3a1c19;--ok:#6fc893;--ok-soft:#183126;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101317;--surface:#191e24;--surface2:#212830;--ink:#e6e9ec;--muted:#98a2ad;--line:#2d353e;
  --brass:#d9a744;--brass-ink:#1a1408;--brass-soft:#372b14;--danger:#ef7468;--danger-soft:#3a1c19;--ok:#6fc893;--ok-soft:#183126;color-scheme:dark}
/* army accents */
.f-orks{--a-fill:linear-gradient(135deg,#c6ef5e 0%,#71b021 55%,#a5d93b 100%);--a-ink:#122005;--a-text:#3f6b0c;--a-soft:#e5f2d0}
.f-tyranids{--a-fill:linear-gradient(135deg,#a06ad0 0%,#552a7a 55%,#8452b3 100%);--a-ink:#fff;--a-text:#6b3a94;--a-soft:#ece2f4}
.f-dark-angels{--a-fill:linear-gradient(135deg,#3f8f63 0%,#103a25 55%,#2b6d4a 100%);--a-ink:#eef6f1;--a-text:#1b5a3b;--a-soft:#dcebe2}
.f-custodes{--a-fill:linear-gradient(135deg,#f7de7e 0%,#c99a2e 55%,#ecc55c 100%);--a-ink:#2b1e05;--a-text:#86600c;--a-soft:#f6ecd0}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .f-orks{--a-text:#a6dc5c;--a-soft:#223212}
  :root:not([data-theme="light"]) .f-tyranids{--a-fill:linear-gradient(135deg,#b07ddc 0%,#6a399a 55%,#9462c2 100%);--a-text:#c6a3e8;--a-soft:#2c1f3a}
  :root:not([data-theme="light"]) .f-dark-angels{--a-fill:linear-gradient(135deg,#4ea474 0%,#1a5a3a 55%,#36845a 100%);--a-text:#78c9a0;--a-soft:#16291f}
  :root:not([data-theme="light"]) .f-custodes{--a-text:#e8bf55;--a-soft:#382c10}}
:root[data-theme="dark"] .f-orks{--a-text:#a6dc5c;--a-soft:#223212}
:root[data-theme="dark"] .f-tyranids{--a-fill:linear-gradient(135deg,#b07ddc 0%,#6a399a 55%,#9462c2 100%);--a-text:#c6a3e8;--a-soft:#2c1f3a}
:root[data-theme="dark"] .f-dark-angels{--a-fill:linear-gradient(135deg,#4ea474 0%,#1a5a3a 55%,#36845a 100%);--a-text:#78c9a0;--a-soft:#16291f}
:root[data-theme="dark"] .f-custodes{--a-text:#e8bf55;--a-soft:#382c10}
/* app themes (Settings): override base tokens only */
:root.t-void{--bg:#0b0f17;--surface:#121826;--surface2:#1a2233;--ink:#e3e8f2;--muted:#8b97ad;--line:#253049;--brass:#7aa7ff;--brass-ink:#071022;--brass-soft:#1b2b4d;color-scheme:dark}
:root.t-forge{--bg:#141110;--surface:#1d1917;--surface2:#272220;--ink:#efe7e2;--muted:#a69a92;--line:#3a312c;--brass:#ff8a3d;--brass-ink:#1a0c03;--brass-soft:#3d2414;color-scheme:dark}
:root.t-bone{--bg:#ebe8e3;--surface:#f8f6f3;--surface2:#efebe6;--ink:#1f1b18;--muted:#6a625b;--line:#d6d0c8;--brass:#9b1c2c;--brass-ink:#fff4f4;--brass-soft:#f1dadd;color-scheme:light}
:root.t-ice{--bg:#e8eef4;--surface:#f7fafd;--surface2:#edf2f7;--ink:#14202c;--muted:#566677;--line:#cfdae5;--brass:#1f5fbf;--brass-ink:#f2f7ff;--brass-soft:#d8e5f8;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
*{box-sizing:border-box}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2rem}h2{font-size:1.35rem}h3{font-size:1.1rem}
p{margin:0}
.eyebrow{font:600 .72rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.875rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{position:relative;background:var(--bg);display:flex;gap:12px;align-items:flex-end;justify-content:space-between;padding-block:18px 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.top .grow{min-width:0;display:grid;gap:6px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--a-fill)}
.top .eyebrow{color:var(--a-text)}
.grp{font:700 .95rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--a-text)}
.top h1{overflow-wrap:anywhere}
.stack{display:grid;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:40px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--a-fill);border-color:transparent;color:var(--a-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.875rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--a-text);outline-offset:2px}
label.f{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);font-size:1rem;font-weight:400}
textarea{min-height:88px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.875rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--a-fill);color:var(--a-ink);border-color:transparent}
.badge{flex:none;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:8px;background:var(--a-fill);color:var(--a-ink);font:700 .85rem/1 var(--display);letter-spacing:.06em}
.badge.s{width:30px;height:30px;font-size:.68rem;border-radius:6px}
.tag{display:inline-flex;align-items:center;border-radius:6px;padding:2px 8px;font-size:.78rem;font-weight:600;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.tag.brass{background:var(--a-soft);border-color:transparent;color:var(--ink)}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.card{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card .body{min-width:0;display:grid;gap:4px;flex:1}
.meter{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--a-fill)}
.meter.over i{background:var(--danger)}
.entry{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.entry:first-child,.grp+.entry{border-top:0;padding-top:0}
.entry select{width:auto;min-width:0;max-width:100%;padding:6px 8px;font-size:.9rem}
.warn{display:grid;gap:6px;padding:0;margin:0;list-style:none}
.warn li{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 10px;font-size:.9rem;font-weight:600}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;display:grid;gap:10px;justify-items:start;color:var(--muted)}
.empty h3{color:var(--ink)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs nav{display:flex;gap:4px;width:100%;max-width:760px;justify-content:space-between}
.tabs button{appearance:none;border:0;background:transparent;border-radius:999px;padding:10px 12px;font:700 .9rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px;flex:0 0 auto;transition:background .15s,color .15s}
.tabs button svg{width:22px;height:22px;flex:none}
.tabs button span{display:none}
.tabs button[aria-current=page]{background:var(--brass-soft);color:var(--ink);flex:1 1 auto;justify-content:center}
.tabs button[aria-current=page] span{display:inline}
.tabs button[aria-current=page] svg{color:var(--brass)}
.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding-block:10px 6px;max-width:760px;margin:0 auto;padding-inline:16px}
.searchbar input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px 10px 40px;font-size:1rem;color:var(--ink)}
.searchbar .sicon{position:absolute;left:30px;top:21px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.results{position:absolute;left:16px;right:16px;top:calc(100% - 2px);background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:60vh;overflow:auto;box-shadow:0 12px 30px rgb(0 0 0 / .25);padding:6px}
.results p.grp{padding:8px 10px 4px;margin:0}
.res{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.res:hover,.res:focus-visible{background:var(--surface2)}
.res .body{min-width:0;display:grid}
.res small{color:var(--muted)}
.cat{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.cat:first-of-type{border-top:0;padding-top:0}
.cat-h{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);width:100%;text-align:left}
.cat-h h3{font:700 1.45rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;border-left:5px solid var(--a-text);padding-left:10px;color:var(--a-text)}
.gslot{display:grid;gap:6px}
.gslot>p{margin:0}
.msec{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.msec-h{background:#1d2b44;color:#fff;font:700 .95rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:8px 10px}
.msec.act .msec-h{background:#b98a1a;color:#1a1305}
.mwhen{padding:7px 10px;border-bottom:1px solid var(--line);font-size:.88rem}.mwhen b{text-transform:uppercase;font-size:.75rem;letter-spacing:.08em;margin-right:6px;background:var(--ink);color:var(--surface);padding:2px 6px;border-radius:4px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 10px;font-size:.9rem}
.mrow+.mrow{border-top:1px dashed var(--line)}
.mrow .vp{flex:none;font:700 1.1rem/1 var(--mono);text-align:right;display:grid;justify-items:end;gap:2px}.mrow .vp small{font:600 .6rem/1 var(--mono);text-transform:uppercase;color:var(--muted)}
.mrow.cum{background:var(--surface2)}.plus{color:var(--a-text)}
.mor{text-align:center;font:700 .7rem/1 var(--mono);text-transform:uppercase;color:var(--muted);padding:2px}
.mpre{font-style:italic;font-size:.88rem;border-left:3px solid var(--a-text);padding-left:10px;margin:0}
.mact{padding:8px 10px;display:grid;gap:4px;font-size:.88rem}.mact p{margin:0}
.radios{display:grid;gap:4px}
.radios label{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.radios input{accent-color:var(--a-text);width:18px;height:18px;margin:0}
.faq{margin:0;padding-left:20px;display:grid;gap:8px}
.mission .cat-h h3{font-size:1.1rem}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cat-h .chev{transition:transform .15s;color:var(--muted)}
.cat.closed .chev{transform:rotate(-90deg)}
.cat-count{font:600 .8rem/1 var(--mono);color:var(--muted)}
.rulebox{background:#fff;color:#1b1f24;border:1px solid #d3d8de;border-radius:var(--r);padding:14px;display:grid;gap:10px;color-scheme:light}
.rulebox details>summary{color:#1b1f24}
.rulebox h2,.rulebox h3,.rulebox strong{color:#111418}
.rulebox p,.rulebox .rules{color:#2a3038}
.rulebox .num{color:#6b7480}
.rule-item{display:grid;gap:3px;padding-block:6px;border-top:1px solid #e5e8ec}
.rule-item:first-child{border-top:0}
.gear{display:grid;gap:6px;background:var(--surface2);border-radius:8px;padding:10px}
.gear label{display:flex;gap:8px;align-items:center;font-size:.92rem}
.gear ul{margin:0;padding-left:18px;font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.flash{animation:flash 1.4s ease-out}@keyframes flash{0%{box-shadow:0 0 0 3px var(--brass)}100%{box-shadow:0 0 0 3px transparent}}}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.theme{border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;display:grid;gap:8px;text-align:left;background:var(--surface);color:var(--ink)}
.theme[aria-pressed=true]{border-color:var(--brass)}
.theme .sw{display:flex;height:34px;border-radius:8px;overflow:hidden}
.theme .sw i{flex:1}
.score{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.score{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ctr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:6px;justify-items:center}
.ctr .v{font:600 2rem/1 var(--mono);font-variant-numeric:tabular-nums}
.ctr .row{flex-wrap:nowrap}
.ctr .btn{min-width:40px;justify-content:center;padding:4px}
.seg{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:7px;padding:8px 10px;font:600 .9rem/1 var(--body);cursor:pointer;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -3px 0 var(--a-text),0 1px 2px rgb(0 0 0 / .15)}
/* stratagem timing colours: fixed, independent of theme and army */
.strat{--sc:#2563c9;--sl:#dce8fc;--st:#1a4ea6;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;background:var(--surface)}
.strat.s-opp{--sc:#c3362b;--sl:#fbe1de;--st:#9c271e}
.strat.s-either{--sc:#0f8a72;--sl:#d4f1e9;--st:#0b6a57}
.strat .sh{background:var(--sc);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.strat>summary{list-style:none;cursor:pointer}
.strat>summary::-webkit-details-marker{display:none}
.strat>summary::before{content:none}
.strat .chev{transition:transform .15s;margin-left:6px}
.strat[open] .chev{transform:rotate(180deg)}
.strat .sb{color:var(--ink)}
.disp-take{--dc:#2f8a3b}.disp-disr{--dc:#1f6aa5}.disp-purge{--dc:#a5232c}.disp-prio{--dc:#b8901c}.disp-recon{--dc:#13808a}
.tag.disp{background:var(--dc);color:#fff;border-color:transparent}
.chip.disp[aria-pressed=true]{background:var(--dc);color:#fff}
.strat .sh h3{color:inherit}
.strat .sh small{display:block;opacity:.85;font-size:.78rem;font-weight:600;letter-spacing:.04em}
.strat .sb{padding:10px 12px;display:grid;gap:8px}
.strat.used{opacity:.55}
.strat .cp{font:700 1.25rem/1 var(--mono);color:inherit;white-space:nowrap}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.rules{white-space:pre-wrap;font-size:.93rem;overflow-wrap:anywhere}
.statline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:center}
.statline div{padding:4px 2px;border-left:1px solid var(--line)}
.statline div:first-child{border-left:0}
.statline b{display:block;font:600 .66rem/1.2 var(--body);letter-spacing:.08em;color:var(--muted)}
.statline span{font:600 .95rem/1.3 var(--mono)}
.unit.dead{opacity:.5}.unit.dead h3{text-decoration:line-through}

.wtab-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.wtab{width:100%;border-collapse:collapse;font-size:clamp(.66rem,2.9vw,.85rem);table-layout:fixed}
.wtab th:not(:first-child),.wtab td:not(:first-child){width:9.5%;padding-inline:1px}
.wtab th:nth-child(2),.wtab td:nth-child(2){width:12%}
.wtab td:first-child{overflow-wrap:anywhere}
.wtab th{font-size:clamp(.55rem,2.4vw,.7rem)!important;letter-spacing:.02em!important}
.wtab th{font:700 .7rem/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--a-ink);background:var(--a-fill);padding:6px 6px;text-align:center}
.wtab th:first-child{text-align:left}
.wtab td{padding:6px;border-top:1px solid var(--line);text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;vertical-align:top}
.wtab td:first-child{text-align:left;font-family:var(--body);font-weight:600}
.wtab td small{display:block;font-weight:400;color:var(--a-text);font-size:.75rem;letter-spacing:.02em}
.wgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.wgrid.m{grid-template-columns:repeat(5,minmax(0,1fr))}
details>summary{cursor:pointer;font-weight:600;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--muted)}
details[open]>summary::before{content:"▾ "}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;background:var(--surface2)}
.item input,.item select,.item textarea{background:var(--surface)}
[hidden]{display:none!important}
.sheet{position:fixed;inset:0;z-index:20;background:rgb(8 10 12 / .55);display:flex;align-items:flex-end;justify-content:center}
.sheet .pane{background:var(--surface);width:100%;max-width:760px;max-height:85%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start}
.pick{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.pick:disabled{opacity:.45;cursor:not-allowed}
.pick .body{min-width:0;display:grid;gap:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px)}
.notice{background:var(--brass-soft);border-radius:var(--r);padding:12px;font-size:.92rem}
pre{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font:500 .8rem/1.5 var(--mono);margin:0}
@media (prefers-reduced-motion:no-preference){.sheet .pane{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<script>
const FACTIONS=[
  {id:'custodes',name:'Adeptus Custodes',abbr:'ADC'},
  {id:'dark-angels',name:'Dark Angels',abbr:'DA'},
  {id:'orks',name:'Orks',abbr:'ORK'},
  {id:'tyranids',name:'Tyranids',abbr:'TYR'}];
const CORE_RULES=[{"id": "r01", "num": "01", "title": "Core Concepts", "items": [["Armies, units and models", "Each player controls an army of units; a unit is one or more models that move and fight together. A model's base counts as part of the model. Friendly means your army, enemy means your opponent's; rules that don't say either affect both. Anything that applies to a unit applies to every model in it."], ["Active and opposing player", "One player is always active. During your turn you're active, except that whoever's unit is moving, shooting or fighting is the active player until that move or those attacks finish. Outside turns, the player who goes first in the round is active."], ["Measuring", "Distances are in inches and can be measured at any time. Measure to and from the closest part of a model's base."], ["Dice", "D6 is a six-sided die. 3+ means 3 or more; 2D6 adds two dice; D3 is a D6 halved, rounding up."], ["Leadership and battle-shock rolls", "Roll 2D6: if it equals or beats a Ld value in the unit, it passes. A failed battle-shock roll makes the unit battle-shocked: its OC becomes '-', you can't target it with stratagems, and it can't start or complete actions."]]}, {"id": "r02", "num": "02", "title": "Datasheets", "items": [["Profiles", "M (Move), T (Toughness), Sv (Save), InSv (Invulnerable save, if any), W (Wounds), Ld (Leadership) and OC (Objective Control). M of '-' means it can't move once set up; OC of '-' means it can't control objectives."], ["Weapons", "Range (Melee for melee weapons), A (Attacks), BS or WS (skill to hit), S (Strength), AP (Armour Penetration), D (Damage)."], ["Keywords", "Faction keywords are used for army building; otherwise all keywords work the same. Rules tied to a keyword only affect units with it."], ["Composition and wargear options", "Lists the models in the unit and their default wargear, plus options for swapping weapons when you add the unit to your army."]]}, {"id": "r03", "num": "03", "title": "Moving", "items": [["Moving models", "Move models one at a time in straight lines and rotations. Rotating doesn't use distance. Models can pass through friendly models and any gap their base fits, but not through enemy models or off the table edge."], ["Ending a move", "At the end, the unit must be in coherency, no model can be on another model or partway through a wall, and any 'after moving' conditions must be met, otherwise the models go back and the move didn't happen."], ["Setting up", "When setting up, the unit must be in coherency, unengaged and meet any other restrictions. If it can't, it goes back where it came from."], ["Coherency", "Every model must be within 2\" horizontally and 5\" vertically of another model in the unit, and within 9\" of every other model. In each End of Turn step, remove models until out-of-coherency units are back in coherency (these don't count as being destroyed for rules)."], ["Engagement", "Engagement range is 2\" horizontally and 5\" vertically. Models within it of an enemy are engaged with that enemy; a unit with no engaged models is unengaged."]]}, {"id": "r04", "num": "04", "title": "Making Attacks", "items": [["Sequence", "1) Select weapons, 2) select targets, 3) resolve attacks."], ["Select weapons", "Shooting: pick any of the model's ranged weapons. Fighting: pick exactly one melee weapon."], ["Select targets", "Shooting: one enemy unit per weapon that is visible, in range and unengaged. Fighting: one or more engaged enemy units, no more targets than the weapon's Attacks; split the attacks between them."], ["Resolve attacks", "Pick a target unit, gather attack dice for a weapon (rolling identical attacks together), resolve the attack sequence, then repeat for the remaining weapons and targets. Identical attacks share BS/WS, S, AP, D and the same rules."]]}, {"id": "r05", "num": "05", "title": "Attack Sequence", "items": [["1. Hit rolls", "Roll a D6 per attack. Unmodified 1 always fails; unmodified 6 is a critical hit; otherwise it hits on the BS/WS or better."], ["2. Wound rolls", "Roll a D6 per hit. Unmodified 1 fails; unmodified 6 is a critical wound. S at least double T: 2+. S greater than T: 3+. S equal to T: 4+. S less than T: 5+. S half T or less: 6+."], ["3. Save rolls", "The defender splits the unit into groups: each Character on its own, and others grouped by matching W, Sv and InSv. Wounded non-Character groups go first; Characters always go after non-Characters (wounded Characters first). One save roll per wound."], ["4. Inflict damage", "Resolve saves from lowest to highest against the current group, picking an already-wounded model if possible. Unmodified 1 always fails. The save passes if it equals or beats the InSv, or if the roll modified by AP equals or beats the Sv. Each failed save removes wounds equal to D; a model at 0 wounds is destroyed. Extra attacks after the unit is wiped out are lost."], ["Critical hits and wounds", "Criticals still count as hits and wounds, and trigger abilities such as [Lethal Hits] and [Devastating Wounds]."]]}, {"id": "r06", "num": "06", "title": "Other Concepts", "items": [["Visibility", "A model is visible if a 1 mm line can be drawn from any part of the observer to any part of it (ignoring models in either unit). Fully visible means every facing part can be seen. A unit is visible if any model is, fully visible if every model is. Terrain adds its own rules."], ["Mortal wounds", "Each mortal wound removes 1 wound. Allocate to a wounded non-Character first, then any non-Character, then a wounded Character, then any Character. When attacks cause both normal damage and mortal wounds, resolve the normal damage first."], ["Hazard rolls", "Roll a D6: on 1-2 the unit takes 1 mortal wound, or 3 if every model is a Monster or Vehicle. Multiple hazard rolls are made together."]]}, {"id": "r07", "num": "07", "title": "The Battle Round", "items": [["Structure", "Start of battle round, then each player takes a turn (the same player always goes first, as set by the mission), then end of battle round. Non-mission rules resolve before mission scoring at each end step."], ["A turn", "Start of Turn step, then the Command, Movement, Shooting, Charge and Fight phases, then the End of Turn step."]]}, {"id": "r08", "num": "08", "title": "Command Phase", "items": [["Steps", "Start of phase, Gain Core CP, Battle-shock, Command abilities, End of phase."], ["Gain Core CP", "Both players gain 1 CP."], ["Battle-shock", "The active player rolls battle-shock for every unit that is already battle-shocked or is at or below half-strength. A battle-shocked unit that passes recovers."]]}, {"id": "r09", "num": "09", "title": "Movement Phase", "items": [["Moving units", "Every unit must be selected to move once, including those in reserves or embarked; one option is to remain stationary."], ["Remain stationary", "Nothing moves, and rules triggered by starting or ending a move don't trigger."], ["Normal move", "Up to M. Must start and end unengaged."], ["Advance move", "Roll a D6 and move up to M plus the roll. Must end unengaged. Unless a rule says otherwise, the unit can't declare a charge or start an action this turn."], ["Fall-back move", "Up to M, for engaged units. Ordered Retreat is allowed if not battle-shocked. Desperate Escape (otherwise, or by choice) makes a hazard roll per model, lets models move through enemies, and forces a battle-shock roll afterwards if not already shocked. Must end unengaged; the unit can't shoot, charge or start actions this turn."]]}, {"id": "r10", "num": "10", "title": "Shooting Phase", "items": [["Shooting", "Select eligible units one at a time and pick a shooting type for each."], ["Normal shooting", "Unengaged and didn't Advance."], ["Assault shooting", "Unengaged, Advanced, and has [Assault] weapons; only those weapons can fire."], ["Close-quarters shooting", "Engaged, didn't Advance, and has [Close-Quarters] weapons or is a Monster/Vehicle. Infantry and similar can only fire Close-Quarters weapons at units they're engaged with. Monsters and Vehicles can fire everything, at -1 to hit except Close-Quarters weapons at engaged targets; [Blast] can't target engaged units."], ["Indirect shooting", "Unengaged, didn't Advance, has [Indirect Fire] weapons. Those weapons can hit unseen targets, the target always gets cover, hit rolls can't be re-rolled, and unmodified 1-5 miss (1-3 if the unit stayed stationary and a friendly unit can see the target)."], ["After shooting", "Units that shot can't start an action this phase."]]}, {"id": "r11", "num": "11", "title": "Charge Phase", "items": [["Declaring a charge", "A unit can declare a charge if it's within 12\" of an enemy, unengaged, and didn't Advance or Fall Back this turn. Roll 2D6 for the charge distance."], ["Charge move", "Pick charge targets within 12\" and within the rolled distance. Each model must end closer to a target, within 1\" of one if possible, and engaged if possible. The unit must end engaged with every target and no other enemy. Charging units gain Fights First until the end of the turn. A roll of 2 can never succeed without modifiers."]]}, {"id": "r12", "num": "12", "title": "Fight Phase", "items": [["Steps", "Start of phase, Pile in, Fight, Consolidate, End of phase. Units that can fight must, but piling in and consolidating are optional."], ["Pile in", "Up to 3\" for units that are engaged, charged this turn, or are making an overrun fight. Models in base contact stay put; others end closer to the nearest pile-in target and engaged if possible. The active player's units go first."], ["Fight order", "Starting with the active player, players alternate picking Fights First units, then all remaining eligible units. If a Fights First unit becomes eligible later, return to the Fights First step."], ["Normal fight", "For engaged units: fight as normal."], ["Overrun fight", "For units that are unengaged (or became engaged mid-step): make one extra pile-in move, then fight."], ["Consolidate", "Up to 3\" for units that were eligible to fight. Ongoing (engaged): stay engaged and move closer. Engaging (within 3\" of enemies): must end engaged with the selected units, and any of them that haven't fought now fight. Objective (within 3\" of an objective): end within range of it."], ["Unable to fight", "If all your eligible units are more than 5\" from enemies, you can pass back to your opponent."]]}, {"id": "r13", "num": "13", "title": "Terrain", "items": [["Terrain areas", "Terrain sits in agreed areas (or on mats), and each feature is Exposed, Light or Dense."], ["Movement", "Exposed and Light: anyone moves through. Dense: Infantry, Beasts, Swarm and Mobile move through horizontally, and Infantry, Beasts and Swarm can climb. Others can cross dense sections 2\" or lower, or climb taller sections but can't end on upper floors. Climbing counts vertical distance and models must stay within ½\" of the feature. Only Infantry, Beasts, Swarm, Fly and Monster can end on upper levels."], ["Benefit of cover", "If every model in the target is Infantry, Beasts or Swarm in a terrain area, or isn't fully visible because of terrain or obscuring areas, the attack gets -1 to BS (worsened by 1)."], ["Hidden", "Infantry, Beasts and Swarm in an area with dense terrain whose unit didn't shoot this turn or last turn can only be seen by enemies within their detection range (normally 15\")."], ["Obscuring", "Areas with light or dense terrain block sight when every line between two models crosses one (ignoring areas either model is in)."], ["Solid", "Dense features block sight through enclosed gaps (doors, windows) 3\" or less above the ground, and models can't end a move poking through those parts."], ["Plunging fire", "+1 BS when shooting at a unit with models on the ground from terrain 3\" or higher, or from a Towering model within 12\". Doesn't apply to or against Aircraft."]]}, {"id": "r14", "num": "14", "title": "Objectives", "items": [["Terrain objectives", "Objectives are the terrain areas at the mission's points. A model is in range while inside that area."], ["Control", "At the end of each phase and turn, add up the OC of each player's models in range: the higher total controls it; a tie means nobody does unless it's secured. A unit with OC 1+ in range of an objective its army controls is controlling it."], ["Secured", "A secured objective stays yours with nobody on it until your opponent's level of control beats yours at the end of a phase."], ["Objective markers", "If an objective isn't in a terrain area, use a 40 mm marker; models are in range within 3\" horizontally and 5\" vertically."]]}, {"id": "r15", "num": "15", "title": "Stratagems", "items": [["Using stratagems", "Each one shows a CP cost, When, Target, Effect and any Restrictions. Pick targets, pay the CP (plus any optional +CP sections you choose), then resolve the effect."], ["Limits", "Each player can use a given stratagem only once per phase, and can't target the same unit with more than one stratagem in a phase unless a rule says otherwise. Battle-shocked units can't be targeted by their owner's stratagems."], ["Snap shooting", "Used by Fire Overwatch. Target one visible eligible enemy unit within 24\". Attacks only hit on an unmodified 6, regardless of BS or modifiers, and hit rolls can't be re-rolled. These hits are never critical hits, so they can't trigger abilities such as [Sustained Hits] or [Lethal Hits]. The unit can't start an action afterwards this phase."], ["Colour key", "Blue = your turn, red = your opponent's turn, green = either player's turn."]]}, {"id": "r16", "num": "16", "title": "Actions", "items": [["Performing actions", "Each action lists when it starts, which units can do it, its use limit, when it completes and its effect. Actions come from mission packs and other publications."], ["Starting", "A unit can't start one if it's off the table, an Aircraft or Fortification, battle-shocked, OC 0 or '-', engaged (unless Titanic), Advanced or Fell Back this turn, or already started an action this turn. Once started, the unit can't shoot (unless Titanic) or charge this turn."], ["Completing", "If the unit moves (other than pile-in or consolidation) or leaves the battlefield, the action fails."]]}, {"id": "r17", "num": "17", "title": "Monsters and Vehicles", "items": [["Movement", "During normal and Advance moves, Monster and Vehicle models can move through other models except other Monsters and Vehicles."], ["Frame", "Models with the Frame keyword (usually baseless) measure from the closest point of the model and rotate around their centre."], ["Shooting engaged Monsters and Vehicles", "In your Shooting phase you can target engaged enemy Monsters and Vehicles at -1 to hit, except with Close-Quarters weapons from a unit engaged with them. Your own engaged units still need a shooting type that allows shooting while engaged."]]}, {"id": "r18", "num": "18", "title": "Transports", "items": [["Capacity", "Each Transport lists what it can carry; several units can share it if there's room. Units can start the battle embarked."], ["Embarking", "After a normal, Advance or Fall Back move, a unit wholly within 3\" that wasn't set up this turn, is allowed in, and fits, can embark and is removed from the table."], ["Disembark move", "In your Movement phase, if the Transport is on the table, the unit didn't embark this phase and the Transport didn't Advance or Fall Back. Rapid (Transport made a normal or ingress move): set up within 3\" and can't charge. Tactical (Transport hasn't moved or stayed still): set up within 3\" then make a normal or Advance move. Combat (otherwise): set up within 6\", may set up engaged with enemies the Transport is engaged with, hazard roll per model, and the unit is battle-shocked and can't charge."], ["Emergency disembark", "When the Transport is destroyed: hazard roll per model, set up within 6\" as close as possible (models that can't fit are destroyed), and the unit is battle-shocked and can't charge this turn."]]}, {"id": "r19", "num": "19", "title": "Attached Units", "items": [["Forming", "Before the battle, each Leader or Support unit can join one bodyguard unit it's allowed to lead. A bodyguard can have one Leader and one Support. The result is a single unit for all rules."], ["Toughness", "Attacks use the highest T among bodyguard models, or the leaders' highest T once only they remain."], ["Destroyed", "'When destroyed' rules only trigger when the last model that started the battle in the unit dies."], ["Keywords", "The attached unit has every component unit's keywords, but individual models don't gain each other's keywords."], ["Abilities", "Abilities from a specific model (an enhancement or wargear) only affect that model. Unit-wide abilities from the leader or bodyguard last until the last model of that part dies (finishing the current attacker's attacks first). Leaders keep their 'while leading' abilities even if the bodyguard dies, if they started attached."]]}, {"id": "r20", "num": "20", "title": "Strategic Reserves", "items": [["Placing", "In Declare Battle Formations, put units (not Fortifications) in reserves. Their combined points, including anything embarked, can't exceed half your battle size points."], ["Repositioned units", "Units removed to reserves mid-battle keep any timed effects and still count as having Advanced, Fallen Back or disembarked that turn."], ["Ingress move", "From battle round 2 onwards, set up wholly within 6\" of a battlefield edge and more than 8\" from enemies; before round 3 not in the enemy deployment zone. The unit can't make other moves until the next Charge phase. Units still in reserve at the end of round 3 are destroyed, except embarked units whose Transport arrived and repositioned units."]]}, {"id": "r21", "num": "21", "title": "Flying and Surging", "items": [["Surge moves", "When a rule triggers it, an unengaged, non-battle-shocked unit that hasn't moved this phase moves toward the closest enemy unit, ending engaged with it if possible and engaged with nothing else. It can't move again this phase."], ["Taking to the skies", "Fly units making a normal, Advance, Fall Back or charge move can take to the skies: -2\" to the distance, ignore vertical distance, and move through any models and terrain."]]}, {"id": "r22", "num": "22", "title": "Other Rules and Abilities", "items": [["Aura", "Affects units within range, including the source. The same aura doesn't stack on one unit."], ["Faction abilities", "Army rules only work if your Army Faction matches a faction keyword on the unit."], ["Psychic", "Wounds caused by psychic abilities count as psychic attacks."], ["Wargear abilities", "Apply to the unit, or to the bearer model until it's destroyed."], ["Plunging fire", "+1 BS from 3\"+ terrain, or from Towering models within 12\", against targets on the ground."]]}, {"id": "r23", "num": "23", "title": "Aircraft", "items": [["Aircraft", "Must start in strategic reserves, can only make ingress moves, and return to reserves at the end of your opponent's turn. Other units can move through them, and pile-ins, consolidations and surges ignore them unless the mover can Fly. Being engaged only with Aircraft doesn't stop normal or Advance moves. Aircraft can't charge and can only fight Fly units; only Fly units can charge or fight them. Plunging Fire doesn't apply to or against them."]]}, {"id": "r24", "num": "24", "title": "Core Abilities", "items": [["Duplicates", "The same ability (or weapon ability) from multiple sources doesn't stack, even with different numbers or keywords; choose one. For Scouts, use the lowest value not shared by every model."], ["Keyword-limited abilities", "A weapon ability followed by keywords (e.g. [Lethal Hits: Vehicle]) only works against units with those keywords."], ["[Anti-X Y+]", "Unmodified wound rolls of Y+ against X units are critical wounds."], ["[Assault]", "Lets the unit use assault shooting after Advancing."], ["[Blast] / [Blast X]", "+1 attack (or +X) per 5 models in the target. Can't target engaged units."], ["[Cleave X]", "If all the weapon's attacks go into one target, +X attacks per 5 models in it."], ["[Close-Quarters] / [Pistol]", "Allows close-quarters shooting. Under other shooting types, a non-Monster/Vehicle model fires either its Close-Quarters weapons or its other ranged weapons, not both. [Pistol] works identically."], ["Deadly Demise X", "When the model dies (after any emergency disembark), roll a D6; on a 6 every unit within 6\" takes X mortal wounds."], ["Deep Strike", "If every model has it, ingress moves can set up anywhere more than 8\" from enemies, including the enemy deployment zone."], ["[Devastating Wounds]", "A critical wound ends the attack sequence and inflicts mortal wounds equal to D (after normal damage). Each critical wound can kill at most one model."], ["[Extra Attacks]", "Fight with these weapons in addition to one other melee weapon."], ["Feel No Pain X+", "Roll a D6 for each wound the model would lose; on X+ it isn't lost."], ["Fights First", "A unit where every model has it is picked in the Fights First step."], ["Firing Deck X", "When the Transport shoots, pick up to X embarked models and one ranged weapon each (not One Shot) to fire as part of the Transport; those units can't shoot this turn."], ["[Hazardous]", "After shooting or fighting, one hazard roll per Hazardous weapon used."], ["[Heavy]", "+1 to hit in your Shooting phase if the unit is unengaged, wasn't set up this turn and no model moved more than 3\"."], ["Hover", "No -2\" penalty when taking to the skies."], ["[Ignores Cover]", "The target can't get the benefit of cover, including from Stealth."], ["[Indirect Fire]", "Allows indirect shooting."], ["Infiltrators", "If every model has it, deploy anywhere more than 8\" from the enemy deployment zone and enemy units."], ["[Lance]", "+1 to wound if the unit charged this turn."], ["Leader / Support", "See Attached Units."], ["[Lethal Hits]", "A critical hit can automatically wound (skipping the wound roll, so it can't become a critical wound)."], ["Lone Operative (X\")", "Unless attached, only visible to enemies within 12\" (or X\") and can't be targeted by Indirect Fire from further away."], ["[Melta X]", "+X Damage against targets within half range."], ["[One Shot]", "Can only be fired once per battle (revived models don't reset it; newly added units do)."], ["[Precision]", "If the attacker can see a Character in the target, it can pick that Character's group as the current allocation group."], ["[Psychic]", "Ignore modifiers to BS/WS and hit rolls; these are psychic attacks."], ["[Rapid Fire X]", "+X attacks against targets within half range."], ["Scouts X\"", "If every model has it, before the battle the unit can deploy from reserves into your deployment zone, or make a scout move of up to X\" ending more than 8\" from enemies (Dedicated Transports full of Scouts units can too). Can't embark after a scout move."], ["Stealth", "If every model has it, ranged attacks against the unit treat it as in cover."], ["Super-Heavy Walker", "Moves through non-Titanic models and terrain up to 4\" tall, and can choose to gain Mobile for a move (battle-shocked on a D6 roll of 1 afterwards)."], ["[Sustained Hits X]", "A critical hit scores X extra hits."], ["[Torrent]", "Automatically hits."], ["[Twin-Linked]", "Re-roll the wound roll."]]}, {"id": "r25", "num": "A", "title": "Rules Appendix", "items": [["Starting strength", "The number of models at the start of battle round 1 (attached units count all their models). Single-model units use wounds instead: below starting strength once damaged, at half-strength at exactly half wounds, below half-strength under that. Odd numbers can't be exactly at half-strength."], ["Destroyed", "A unit is destroyed when all its models are. 'When destroyed' rules resolve before removal, after the attacker finishes its attacks. Destroyed models can't use or be targeted by rules."], ["Different Move values", "Each model in a unit moves up to its own M."], ["Mixed keywords", "A unit has every keyword its models have, but each model keeps only its own."], ["Revived models", "Returned models can't take a unit over its starting strength. They come back with their wargear and enhancements at full wounds, in coherency, and can only be set up engaged with enemies already engaged with the unit."], ["FAQ", "A unit with no ranged weapons can still be selected to shoot. Close-quarters Monster/Vehicle Blast weapons can't target engaged units, and nobody can Blast an engaged Monster/Vehicle. Overrun fights need the unit to be eligible to fight. Units can't embark after a scout move."]]}];

const $=s=>document.querySelector(s);
const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,10);
const slug=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||rid();
const clone=o=>JSON.parse(JSON.stringify(o));
const badge=(fid,small)=>{const f=FX[fid]||{abbr:'?'};return `<span class="badge f-${fid}${small?' s':''}" aria-hidden="true">${f.abbr}</span>`};
const CATS=['Epic Hero','Character','Battleline','Transport','Vehicle','Monster','Mounted','Other'];
const CAT_GROUP={'Epic Hero':'Epic Heroes','Character':'Characters','Battleline':'Battleline','Transport':'Transports','Vehicle':'Vehicles','Monster':'Monsters','Mounted':'Mounted','Other':'Other'};
const GROUP_ORDER=CATS.map(c=>CAT_GROUP[c]);
function catOf(u){if(CATS.includes(u.category))return u.category;const r=u.roles||{};if(r.epicHero)return'Epic Hero';if(r.character)return'Character';if(r.battleline)return'Battleline';if(r.transport)return'Transport';return{Vehicle:'Vehicle',Monster:'Monster',Mounted:'Mounted'}[u.kind]||'Other'}
function rolesOf(u){const c=catOf(u);return{epicHero:c==='Epic Hero',character:c==='Epic Hero'||c==='Character',battleline:c==='Battleline',transport:c==='Transport'}}
function groupOf(u){return CAT_GROUP[catOf(u)]}
function grouped(items,getUnit){const m={};for(const it of items){const u=getUnit(it);const g=u?groupOf(u):'Other';(m[g]||(m[g]=[])).push(it)}return GROUP_ORDER.filter(g=>m[g]).map(g=>[g,m[g]])}
const byName=(a,b)=>String(a.name||'').localeCompare(String(b.name||''));
const detsOf=fid=>Object.entries(S.dets).filter(([,d])=>d.faction===fid).map(([id,d])=>({id,...d})).sort(byName);
const unitsOf=fid=>Object.entries(S.units).filter(([,u])=>u.faction===fid).map(([id,u])=>({id,...u})).sort(byName);

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
async function write(fn,okMsg){
  if(!S.db){toast('Shared data is not available in this view.');return false}

    return false}
}

/* ---------- list maths ---------- */
function findEnh(key){if(!key)return null;const[did,eid]=key.split(':');const d=S.dets[did];const e=d&&(d.enhancements||[]).find(x=>x.id===eid);return e?{...e,det:d.name}:null}
const dispsOf=d=>Array.isArray(d.dispositions)&&d.dispositions.length?d.dispositions:(d.disposition?[d.disposition]:[]);
const phasesOf=s=>Array.isArray(s.phases)&&s.phases.length?s.phases:[s.phase||'Any phase'];
const modelsOf=u=>u.models?.length?u.models:(u.stats&&STATS.some(k=>u.stats[k])?[{name:'',...u.stats,inv:''}]:[]);
const ord=n=>n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th');
function unitCost(u,e,copy){const t=(u.tiers||[])[e.tier||0];if(!t)return{pts:0,later:false};
  const later=!!(u.band2From&&copy>=u.band2From&&t.pts2!==''&&t.pts2!=null);let p=+(later?t.pts2:t.pts)||0;
  for(const[i,n]of Object.entries(e.wg||{}))p+=(+(u.wargear?.[i]?.pts)||0)*(+n||0);return{pts:p,later}}
const normName=s=>String(s||'').toUpperCase().replace(/[’']/g,"'").trim();
function calc(l){
  const dets=(l.detachments||[]).map(id=>S.dets[id]?{id,...S.dets[id]}:null).filter(Boolean);
  const sz=sizeOf(l);let pts=0,enh=0,war=0;const w=[];const counts={};const cost={},later={};const enhUse={};
  for(const e of l.entries||[]){
    const u=S.units[e.unitId];
    if(!u){w.push('A unit in this list was removed from the codex.');continue}
    counts[e.unitId]=(counts[e.unitId]||0)+1;
    const uc=unitCost(u,e,counts[e.unitId]);let ep=uc.pts;later[e.id]=uc.later;
    if(e.enhId){const en=findEnh(e.enhId);if(en&&(l.detachments||[]).includes(e.enhId.split(':')[0])){ep+=+en.pts||0;enhUse[e.enhId]=(enhUse[e.enhId]||0)+1;if(enhUse[e.enhId]===1)enh++;
        const r=rolesOf(u);if(r.epicHero)w.push(`${u.name}: Epic Heroes can't take enhancements.`);else if(!r.character&&!en.upgrade)w.push(`${u.name}: only Characters can take ${en.name}.`)}
      else w.push(`${u.name}: its enhancement isn't offered by your current detachments.`)}
    cost[e.id]=ep;pts+=ep;
    if(e.warlord)war++;
  }
  for(const[k,n]of Object.entries(enhUse)){const en=findEnh(k);if(!en)continue;if(!en.upgrade&&n>1)w.push(`${en.name} is taken ${n} times. Each enhancement can only be taken once.`);if(en.upgrade&&n>3)w.push(`${en.name} is taken ${n} times. Upgrades are limited to 3.`)}
  for(const[id,n]of Object.entries(counts)){const u=S.units[id];if(!u)continue;const r=rolesOf(u);
    const dbl=r.battleline||/dedicated transport/i.test(u.keywords||'');
    const max=r.epicHero?1:dbl?sz.unit*2:sz.unit;
    if(max&&n>max)w.push(`${u.name}: ${n} copies. The ${sz.name} limit is ${max}.`)}
  const ents=l.entries||[];
  for(const e of ents){const u=S.units[e.unitId];if(!u)continue;
    if(u.leader==='Support'&&!e.attach)w.push(`${u.name} is a Support unit and must be attached to a bodyguard unit.`)
    const host=ents.find(x=>x.id===e.attach);if(!host)continue;
    if(e.enhId&&host.enhId)w.push(`${u.name} and the ${S.units[host.unitId]?.name} it joins both have an enhancement. An attached unit can only have one.`)
    const same=ents.filter(x=>x.attach===host.id&&S.units[x.unitId]?.leader===u.leader);if(same[0]===e&&same.length>1)w.push(`${S.units[host.unitId]?.name} has ${same.length} ${(u.leader||'leader').toLowerCase()} units attached. Only one is allowed.`)}
  const tags={};for(const d of dets)if(d.unique){const k=d.unique.toLowerCase();if(tags[k])w.push(`${tags[k]} and ${d.name} are both Unique: ${d.unique}. Only one can be taken.`);else tags[k]=d.name}
  const dp=dets.reduce((a,d)=>a+(+d.dp||0),0);
  if(pts>l.limit)w.push(`Over the points limit by ${pts-l.limit}.`);
  if(!dets.length)w.push('Add at least one detachment.');
  const incursionBig=sz.name==='Incursion'&&dets.length===1&&dp===3;
  if(dp>sz.dp&&!incursionBig)w.push(`Detachments cost ${dp} DP. ${sz.name} allows ${sz.dp} DP.`);
  if(dets.length&&!l.disposition)w.push('Choose a Force Disposition.');
  if(enh>sz.enh)w.push(`${enh} enhancements taken. ${sz.name} allows ${sz.enh}.`);
  if((l.entries||[]).length&&war!==1)w.push(war?'Only one unit can be your Warlord.':'Nominate a Warlord.');
  return{dets,pts,dp,enh,w,cost,later,sz,enhUse};
}
const dispositionsFor=dets=>[...new Set(dets.flatMap(dispsOf))];

function requestRender(){const a=document.activeElement;if(a&&a.closest('#app,#sheet')&&/^(INPUT|TEXTAREA)$/.test(a.tagName)){S.pending=true;return}render()}

}

function vList(){
  const l=S.lists[S.listId];if(!l)return backTo('lists','That list was deleted.');
  const c=calc(l);const f=FX[l.faction];const ro=!S.canWrite;
  const disps=dispositionsFor(c.dets);
  const usedEnh=new Set((l.entries||[]).map(e=>e.enhId).filter(Boolean));
  const enhPool=c.dets.flatMap(d=>(d.enhancements||[]).map(e=>({key:d.id+':'+e.id,...e,det:d.name})));
  const entryHtml=e=>{const u=S.units[e.unitId];
    if(!u)return `<div class="entry"><div class="row between"><strong class="muted">Removed unit</strong>${ro?'':`<button class="btn sm danger" data-a="rmEntry" data-id="${e.id}">Remove</button>`}</div></div>`;
    const r=rolesOf(u);const tiers=u.tiers||[];const t=tiers[e.tier||0];
    const pool=r.epicHero?[]:enhPool.filter(x=>r.character||x.upgrade);
    const leads=(u.leads||[]).map(normName);
    const hosts=leads.length?(l.entries||[]).filter(x=>x.id!==e.id&&leads.includes(normName(S.units[x.unitId]?.name))):[];
    const host=(l.entries||[]).find(x=>x.id===e.attach);
    return `<div class="entry">
      <div class="row between"><div style="min-width:0"><strong>${h(u.name)}</strong>${e.warlord?' <span class="tag brass">Warlord</span>':''}${r.epicHero?' <span class="tag">Epic Hero</span>':''}${c.later[e.id]?` <span class="tag">${ord(u.band2From)}+ copy price</span>`:''}${host?` <span class="tag">${h(u.leader||'Leader')} · ${h(groupName(l,host))}</span>`:''}${attachedTo(l,e).length?` <span class="tag brass">${h(groupName(l,e))}</span>`:''}</div><span class="num">${c.cost[e.id]??0} pts</span></div>
      <div class="row">

        ${pool.length?`<select data-c="enh" data-id="${e.id}" aria-label="Enhancement" ${ro?'disabled':''}><option value="">${r.character?'No enhancement':'No upgrade'}</option>${pool.map(x=>`<option value="${x.key}" ${x.key===e.enhId?'selected':''} ${x.key!==e.enhId&&((!x.upgrade&&usedEnh.has(x.key))||(x.upgrade&&(c.enhUse[x.key]||0)>=3))?'disabled':''}>${h(x.name)}${x.upgrade?' (Upgrade)':''} (+${h(x.pts)})${x.restrict?' · '+h(x.restrict):''}</option>`).join('')}</select>`:''}

        ${ro?'':`<button class="btn sm" data-a="dupEntry" data-id="${e.id}">Duplicate</button><button class="btn sm danger" data-a="rmEntry" data-id="${e.id}">Remove</button>`}

      ${gearBlock(u,e,ro)}

    </div>`};
  const facCats=CATS.filter(c=>Object.values(S.units).some(u=>u.faction===l.faction&&catOf(u)===c));

  const cats=[...new Set([...facCats,...Object.keys(byCat)])].sort((a,b)=>CATS.indexOf(a)-CATS.indexOf(b));

  const sb=(id,k,d,dis,lab)=>`<button class="btn sm ghost" style="min-height:24px;padding:0 6px" data-a="gsN" data-id="${id}" data-k="${k}" data-n="${d}" ${dis?'disabled':''} aria-label="${lab}">${d>0?'+':'−'}</button>`;
  return `<details class="gear" data-gid="${e.id}" ${S.gearOpen[e.id]?'open':''}><summary class="small">Wargear options · ${changed?h(gearPicks(u,e).join(', ')||'default'):'default loadout'}</summary><div class="stack" style="gap:12px;margin-top:8px">
    ${sl.map((s,i)=>{if(s.kind==='one'){const v=gs[i]??-1;
      const nm='g-'+e.id+'-'+i;const opts=[[-1,s.add?'None':((s.from||[]).join(' + ')||'Default')],...s.choices.map((c,j)=>[j,c.join(' + ')])];

      const mx=slotMax(s,n);const cur=gs[i]||{};const tot=Object.values(cur).reduce((a,b)=>a+ +b,0);
      return `<div class="gslot"><p class="small">${h(s.text||'Options')} <span class="muted num">${tot}/${mx}</span></p><div class="row">${s.choices.map((c,j)=>{const k=+(cur[j]||0);const nm=c.join(' + ');
        return `<span class="tag" style="gap:6px">${h(nm)}${ro?` ×${k}`:` ${sb(e.id,i+':'+j,-1,k<=0,'Fewer '+h(nm))}<span class="num">${k}</span>${sb(e.id,i+':'+j,1,tot>=mx,'More '+h(nm))}`}</span>`}).join('')}</div></div>`}).join('')}

function statlines(u){const ms=modelsOf(u);if(!ms.length)return'';const inv=ms.some(m=>m.inv);const cols=inv?MSTATS:STATS;

function weaponTables(u){

  const tab=(title,list,heads,cols)=>list?.length?`<div class="wtab-wrap"><table class="wtab"><thead><tr><th>${title}</th>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${list.map(w=>row(w,cols)).join('')}</tbody></table></div>`:'';
  return tab('Ranged weapons',u.ranged,['Range','A','BS','S','AP','D'],['range','a','bs','s','ap','d'])+tab('Melee weapons',u.melee,['Range','A','WS','S','AP','D'],['range','a','ws','s','ap','d']);

const turnCls=t=>t==='Your turn'?'s-your':t==="Opponent's turn"?'s-opp':'s-either';

  return `<details class="strat ${turnCls(s.turn)}${o.used?' used':''}" ${o.anchor?`id="${o.anchor}"`:''} ${o.open?'open':''}><summary>${head}</summary>
    <div class="sb">${s.text?`<div class="rules">${h(s.text)}</div>`:''}</div></details>${o.extra?`<div style="margin-top:-4px">${o.extra}</div>`:''}`;

const DISP_CLS={'Take and Hold':'disp-take','Disruption':'disp-disr','Purge the Foe':'disp-purge','Priority Assets':'disp-prio','Reconnaissance':'disp-recon'};
const dtag=x=>`<span class="tag disp ${DISP_CLS[x]||''}">${h(x)}</span>`;
const legend=()=>`<div class="legend" aria-label="Stratagem colours"><span><i style="background:#2563c9"></i>Your turn</span><span><i style="background:#c3362b"></i>Opponent's turn</span><span><i style="background:#0f8a72"></i>Either turn</span></div>`;
function hex2(c){c=c.replace('#','');return [0,2,4].map(i=>parseInt(c.slice(i,i+2),16))}
const lum=c=>{const[r,g,b]=hex2(c).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b};
const mix=(a,b,t)=>'#'+hex2(a).map((v,i)=>Math.round(v+(hex2(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');
function customTokens(t){const dark=lum(t.bg)<.3;const ink=dark?'#eceef1':'#16191d';
  return {'--bg':t.bg,'--surface':t.surface,'--surface2':mix(t.surface,ink,.06),'--ink':ink,'--muted':mix(ink,t.bg,.42),'--line':mix(t.surface,ink,.16),'--brass':t.accent,'--brass-ink':lum(t.accent)>.35?'#111':'#fff','--brass-soft':mix(t.bg,t.accent,.22),'color-scheme':dark?'dark':'light'}}
function applyTheme(){const r=document.documentElement;THEMES.forEach(([c])=>c&&r.classList.remove(c));r.removeAttribute('style');
  const c=(S.customThemes||[]).find(x=>x.id===S.theme);
  if(c){for(const[k,v]of Object.entries(customTokens(c)))r.style.setProperty(k,v)}else if(S.theme)r.classList.add(S.theme)}
function saveThemes(){try{localStorage.setItem('muster-custom-themes',JSON.stringify(S.customThemes||[]))}catch(e){}}

const baseW=n=>String(n||'').split(' - ')[0].split(' – ')[0].trim();

  for(const x of S.core.stratagems||[])add('Core stratagems',x.name,`${x.cp}CP · ${x.turn}`,'cstrat',x.id,'',x.text);
  for(const[fid,rs]of Object.entries(S.core.armyRules||{}))for(const r of rs)add('Army rules',r.name,FX[fid]?.name,'army',fid,'',r.text);
  for(const[id,u]of Object.entries(S.units))add('Units',u.name,`${FX[u.faction]?.name||''} · ${catOf(u)}`,'unit',id,'',u.keywords);
  for(const[id,d]of Object.entries(S.dets)){add('Detachments',d.name,`${FX[d.faction]?.name||''} · ${d.dp} DP`,'det',id,'',dispsOf(d).join(' '));
    for(const e of d.enhancements||[])add('Enhancements',e.name,`${d.name} · ${e.pts} pts`,'det',id,'enh-'+e.id,e.text);
    for(const x of d.stratagems||[])add('Stratagems',x.name,`${d.name} · ${x.cp}CP`,'det',id,'st-'+x.id,x.text)}
  for(const[id,l]of Object.entries(S.lists))add('Lists',l.name||'Untitled list',FX[l.faction]?.name,'list',id,'','');
  return ix;
}
function runSearch(q){
  const box=$('#results');q=q.trim().toLowerCase();if(q.length<2){box.hidden=true;box.innerHTML='';return}
  const terms=q.split(/\s+/);const hits=buildIndex().map(x=>{if(!terms.every(t=>x.s.includes(t)))return null;const tl=x.t.toLowerCase();return{...x,score:(tl===q?0:tl.startsWith(q)?1:tl.includes(q)?2:3)}}).filter(Boolean).sort((a,b)=>a.score-b.score||a.t.localeCompare(b.t)).slice(0,40);
  const groups={};hits.forEach(x=>(groups[x.g]||(groups[x.g]=[])).push(x));
  box.innerHTML=hits.length?Object.entries(groups).map(([g,xs])=>`<p class="grp">${h(g)}</p>${xs.map(x=>`<button class="res" data-a="goto" data-k="${x.k}" data-id="${h(x.id)}" data-n="${h(x.n||'')}"><span class="body"><span>${h(x.t)}</span><small>${h(x.sub||'')}</small></span></button>`).join('')}`).join(''):`<p class="small muted" style="padding:10px">No matches for “${h(q)}”.</p>`;
  box.hidden=false;
}
function closeSearch(){const i=$('#gsearch');if(i){i.value='';i.blur()}const b=$('#results');b.hidden=true;b.innerHTML=''}

      ${unitsOf(l.faction).length?grouped(us,u=>u).map(([lab,xs])=>{return `<p class="grp">${lab}</p>${xs.map(u=>`<button class="pick" data-a="addUnit" data-id="${h(u.id)}"><span class="body"><strong>${h(u.name)}</strong><span class="small muted">${(u.tiers||[]).map(t=>h(t.label)).join(' / ')}</span></span><span class="num small">${(u.tiers||[]).length?unitCost(u,{tier:0},(l.entries||[]).filter(e=>e.unitId===u.id).length+1).pts:'–'} pts</span></button>`).join('')}`}).join('')||'<p class="muted">No matches.</p>':
      `<div class="empty"><h3>No units in the codex</h3><p>Add ${h(FX[l.faction].name)} units in the Codex tab first.</p><button class="btn primary" data-a="toCodex" data-k="units">Open codex</button></div>`}`;
  }else if(s==='opp'){
    const others=Object.entries(S.lists).filter(([id])=>id!==S.playId).sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));
    body=`<h2>Who are you playing?</h2><p class="small muted">Pick your opponent's army from the shared lists. Their Force Disposition sets which primary mission you play.</p>
      ${others.map(([id,o])=>`<button class="pick" data-a="setOpp" data-id="${h(id)}"><span class="row" style="flex-wrap:nowrap;min-width:0">${badge(o.faction)}<span class="body"><strong>${h(o.name||'Untitled list')}</strong><span class="small muted">${calc(o).pts} pts · ${h(o.disposition||'No disposition')}</span></span></span></button>`).join('')||'<p class="muted small">No other lists yet.</p>'}
      <p class="eyebrow" style="margin-top:6px">Not in Muster? Pick their disposition</p><div class="row">${DISPOSITIONS.map(x=>`<button class="chip disp ${DISP_CLS[x]||''}" data-a="setOppDisp" data-k="${x}">${x}</button>`).join('')}</div>
      <div class="row"><button class="btn ghost" data-a="skipOpp">Skip for now</button></div>`;
  }else if(s==='export'||s.type==='text'){
    const txt=s==='export'?rosterText(S.lists[S.listId]):s.text;
    body=`<h2>${s==='export'?'Roster':'Codex JSON'}</h2><textarea id="exportText" rows="14" readonly spellcheck="false" class="num" style="font-size:.85rem">${h(txt)}</textarea>
      <div class="row"><button class="btn primary" data-a="copyText">Copy</button><button class="btn" data-a="closeSheet">Close</button></div>`;
  }
  el.className='sheet';el.hidden=false;el.innerHTML=`<div class="pane" role="dialog" aria-modal="true">${body}</div>`;
}
function rosterText(l){
  const c=calc(l);const lines=[`${l.name} — ${FX[l.faction].name} — ${c.pts}/${l.limit} pts`,
    `Detachments: ${c.dets.map(d=>`${d.name} (${d.dp} DP)`).join(', ')||'none'}`,`Force Disposition: ${l.disposition||'—'}`,''];
  for(const e of l.entries||[]){const u=S.units[e.unitId];if(!u)continue;const t=(u.tiers||[])[e.tier||0];const en=findEnh(e.enhId);const host=(l.entries||[]).find(x=>x.id===e.attach);
    const wg=Object.entries(e.wg||{}).filter(([,n])=>+n>0).map(([i,n])=>`${n}× ${u.wargear?.[i]?.name}`);
    lines.push(`• ${u.name}${t?` (${t.label})`:''} — ${c.cost[e.id]} pts${e.warlord?' [Warlord]':''}${en?`\n    ${en.upgrade?'Upgrade':'Enhancement'}: ${en.name} (+${en.pts})`:''}${wg.length?`\n    Wargear: ${wg.join(', ')}`:''}${gearPicks(u,e).length?`\n    Loadout: ${gearPicks(u,e).join(', ')}`:''}${host?`\n    Attached to: ${groupName(l,host)}`:''}`)}
  return lines.join('\n');
}

/* ---------- actions ---------- */
function listRef(id){return S.db.doc('lists/'+id)}
async function patchList(patch){const id=S.listId;return write(()=>listRef(id).update(patch))}
function newDraft(kind){
  if(kind==='Det')return{faction:S.cfac,name:'',dp:2,dispositions:[],unique:'',ruleName:'',ruleText:'',enhancements:[],stratagems:[]};
  return{faction:S.cfac,name:'',category:'Other',keywords:'',tiers:[{label:'',pts:0}],band2From:'',models:[{name:'',M:'',T:'',Sv:'',inv:'',W:'',Ld:'',OC:''}],wargear:[],leader:'None',leadsText:'',compText:'',ranged:[],melee:[],weapons:'',abilities:''};
}
function normDet(d){return{faction:d.faction,name:String(d.name||'').trim(),dp:+d.dp||1,dispositions:dispsOf(d).filter(x=>DISPOSITIONS.includes(x)),unique:String(d.unique||'').trim(),ruleName:d.ruleName||'',ruleText:d.ruleText||'',
  enhancements:(d.enhancements||[]).map(e=>({id:e.id||rid(),name:e.name||'',pts:+e.pts||0,upgrade:!!e.upgrade,aura:!!e.aura,restrict:e.restrict||'',text:e.text||''})),
  stratagems:(d.stratagems||[]).map(normStrat)}}
function normStrat(s){let ph=phasesOf(s).filter(p=>p==='Any phase'||PHASES.includes(p));if(!ph.length||ph.includes('Any phase'))ph=['Any phase'];
  return{id:s.id||rid(),name:s.name||'',cp:+s.cp||0,type:STRAT_TYPES.includes(s.type)?s.type:'',phases:ph,turn:TURNS.includes(s.turn)?s.turn:TURNS[0],text:s.text||''}}
const WF=['name','range','a','bs','ws','s','ap','d','kw'];
const normW=(w,m)=>{const o={};for(const k of WF)if(!(m&&k==='bs')&&!(!m&&k==='ws'))o[k]=String(w[k]??'').trim();if(m&&!o.range)o.range='Melee';return o};
function normUnit(u){const leads=Array.isArray(u.leads)?u.leads:String(u.leadsText||'').split(',');const comp=Array.isArray(u.composition)?u.composition:String(u.compText||'').split('\n');
  const b2=+u.band2From||null;
  return{faction:u.faction,name:String(u.name||'').trim(),category:catOf(u),
  ranged:(u.ranged||[]).map(w=>normW(w,false)).filter(w=>w.name),melee:(u.melee||[]).map(w=>normW(w,true)).filter(w=>w.name),keywords:u.keywords||'',
  tiers:(u.tiers||[]).map(t=>{const o={label:t.label||'',pts:+t.pts||0};if(b2&&t.pts2!==''&&t.pts2!=null)o.pts2=+t.pts2||0;return o}),band2From:b2,
  wargear:(u.wargear||[]).map(w=>({name:String(w.name||'').trim(),pts:+w.pts||0})).filter(w=>w.name),
  models:modelsOf(u).map(m=>Object.fromEntries([['name',String(m.name||'')],...MSTATS.map(k=>[k,String(m[k]??'')])])),
  leader:['Leader','Support'].includes(u.leader)?u.leader:'',leads:leads.map(x=>x.trim()).filter(Boolean),composition:comp.map(x=>x.trim()).filter(Boolean),
  loadout:u.loadout||'',options:Array.isArray(u.options)?u.options:[],defaultGear:Array.isArray(u.defaultGear)?u.defaultGear:[],gearSlots:Array.isArray(u.gearSlots)?u.gearSlots:[],gearNotes:Array.isArray(u.gearNotes)?u.gearNotes:[],
  weapons:u.weapons||'',abilities:u.abilities||''}}

async function loadGame(listId){
  S.game=null;render();
  const blank={round:1,cp:0,vp:0,opp:0,phase:'Command',mine:true,used:{},units:{},log:[]};
  let g=null;
  if(S.db&&S.uid){try{const snap=await S.db.doc(`data/users/${S.uid}/game-${listId}`).get();if(snap.exists)g=snap.data()}catch(e){}}
  else{try{g=JSON.parse(localStorage.getItem('game-'+listId)||'null')}catch(e){}}
  S.game={...blank,...clone(g||{})};if(!S.game.oppName&&!S.game.oppSkip&&S.view==='play')S.sheet='opp';render();
}
function saveGame(){clearTimeout(saveGame.t);const id=S.playId,g=clone(S.game);saveGame.t=setTimeout(async()=>{
  if(S.db&&S.uid){try{await S.db.doc(`data/users/${S.uid}/game-${id}`).set(g)}catch(e){toast('Game state could not be saved to your account.')}}
  else{try{localStorage.setItem('game-'+id,JSON.stringify(g))}catch(e){}}},500)}
function gameLog(msg){S.game.log.push(`R${S.game.round} ${S.game.phase}: ${msg}`);if(S.game.log.length>60)S.game.log=S.game.log.slice(-60)}

  exportJson(){const data={detachments:Object.values(S.dets),units:Object.values(S.units),coreStratagems:S.core.stratagems||[],armyRules:S.core.armyRules||{}};S.sheet={type:'text',text:JSON.stringify(data,null,2)};render()},
  async importJson(){
    let data;try{data=JSON.parse($('#importText').value)}catch(e){return toast('That isn\'t valid JSON. Check for a missing comma or bracket.')}
    const dets=(data.detachments||[]).filter(d=>FX[d.faction]&&d.name),units=(data.units||[]).filter(u=>FX[u.faction]&&u.name);
    const findId=(coll,f,n)=>Object.entries(coll).find(([,x])=>x.faction===f&&x.name.toLowerCase()===n.trim().toLowerCase())?.[0];
    let n=0;toast('Importing…');
    for(const d of dets){const nd=normDet(d);const id=findId(S.dets,nd.faction,nd.name)||`${nd.faction}-${slug(nd.name)}-${rid().slice(0,4)}`;if(!await write(()=>S.db.doc('detachments/'+id).set(nd)))return;S.dets[id]=nd;n++}
    for(const u of units){const nu=normUnit(u);const id=findId(S.units,nu.faction,nu.name)||`${nu.faction}-${slug(nu.name)}-${rid().slice(0,4)}`;if(!await write(()=>S.db.doc('units/'+id).set(nu)))return;S.units[id]=nu;n++}
    const hasCore=Array.isArray(data.coreStratagems)&&data.coreStratagems.length,hasAR=data.armyRules&&typeof data.armyRules==='object';
    if(hasCore||hasAR){const st=hasCore?data.coreStratagems.map(normStrat):(S.core.stratagems||[]);const ar=hasAR?{...(S.core.armyRules||{}),...data.armyRules}:(S.core.armyRules||{});
      if(await write(()=>S.db.doc('core/rules').set({...S.settings,stratagems:st,armyRules:ar}))){S.core.stratagems=st;S.core.armyRules=ar;n+=hasCore?st.length:0}}
    const skipped=(data.detachments||[]).length-dets.length+(data.units||[]).length-units.length;
    toast(`Imported ${n} entries${skipped?`, skipped ${skipped} with a missing name or unknown faction`:''}.`);S.view='codex';render()},
  async copyText(){const t=$('#exportText');try{await navigator.clipboard.writeText(t.value);toast('Copied')}catch(e){t.focus();t.select();toast('Selected. Use your device\'s copy.')}}
};

document.addEventListener('change',e=>{
  const t=e.target;const c=t.dataset.c;if(!c)return;const l=S.lists[S.listId];
  if(c==='myname'){S.myName=t.value.trim();try{localStorage.setItem('muster-name',S.myName)}catch(e){}toast('Name saved');return}

  else if(c==='gs1'){const v=+t.value;patchList({entries:l.entries.map(x=>{if(x.id!==t.dataset.id)return x;const gs={...(x.gs||{})};if(v<0)delete gs[t.dataset.k];else gs[t.dataset.k]=v;return {...x,gs}})})}
  else if(c==='warlord')patchList({entries:l.entries.map(x=>({...x,warlord:x.id===t.value}))});
  else if(c==='utitle')patchList({entries:l.entries.map(x=>x.id===t.dataset.id?{...x,title:t.value.trim()}:x)});
  else if(c==='attach')patchList({entries:l.entries.map(x=>x.id===t.dataset.id?{...x,attach:t.value}:x)});

});

async function resolveNames(){if(!S.user)return;const ids=[...new Set(Object.values(S.lists).map(l=>l.createdBy).filter(Boolean))];if(!ids.length)return;
  const ps=await S.user.profiles(ids);let ch=false;for(const id of ids){const n=ps[id]?.name||'';if(S.names[id]!==n){S.names[id]=n;ch=true}}if(ch)live()}

function groupKey(){
  const m=location.hash.match(/[#&]g=([A-Za-z0-9_-]{20,})/);
  if(m){try{localStorage.setItem('muster-group',m[1])}catch(e){}history.replaceState(null,'',location.pathname+location.search);return m[1]}
  try{return localStorage.getItem('muster-group')}catch(e){return null}}
async function fbConnect(group){
  const[A,AU,F]=await Promise.all([import(FBV+'firebase-app.js'),import(FBV+'firebase-auth.js'),import(FBV+'firebase-firestore.js')]);
  const app=A.initializeApp(FIREBASE_CONFIG);const auth=AU.getAuth(app);
  await AU.setPersistence(auth,AU.browserLocalPersistence).catch(()=>{});
  if(!auth.currentUser)await AU.signInAnonymously(auth);
  let fs;try{fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache()})}catch(e){fs=F.getFirestore(app)}
  const root='groups/'+group+'/';
  const enc=v=>Array.isArray(v)?(v.some(Array.isArray)?{__json:JSON.stringify(v)}:v.map(enc)):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,enc(x)])):v;
  const dec=v=>Array.isArray(v)?v.map(dec):v&&typeof v==='object'?(typeof v.__json==='string'&&Object.keys(v).length===1?JSON.parse(v.__json):Object.fromEntries(Object.entries(v).map(([k,x])=>[k,dec(x)]))):v;
  const snapOf=x=>({exists:x.exists(),id:x.id,data:()=>dec(x.data())});
  const doc=p=>{const r=F.doc(fs,root+p);return{set:d=>F.setDoc(r,enc(d)),update:d=>F.updateDoc(r,enc(d)),delete:()=>F.deleteDoc(r),get:async()=>snapOf(await F.getDoc(r)),onSnapshot:(cb,err)=>F.onSnapshot(r,x=>cb(snapOf(x)),err)}};
  const collection=c=>({onSnapshot:(cb,err)=>F.onSnapshot(F.collection(fs,root+c),x=>cb({docs:x.docs.map(d=>({id:d.id,data:()=>dec(d.data())}))}),err)});
  const meta=await F.getDoc(F.doc(fs,root+'meta/seed'));
  if(!meta.exists()){toast('Setting up your group for the first time…');
    const seed=await (await fetch('seed.json')).json();const ops=[];
    for(const[c,docs]of Object.entries(seed))for(const[id,d]of Object.entries(docs))ops.push([c+'/'+id,d]);
    for(let k=0;k<ops.length;k+=400){const b=F.writeBatch(fs);for(const[p,d]of ops.slice(k,k+400))b.set(F.doc(fs,root+p),enc(d));await b.commit()}
    await F.setDoc(F.doc(fs,root+'meta/seed'),{at:Date.now()})}
  return{db:{doc,collection},uid:auth.currentUser.uid};
}
async function boot(){
  try{S.theme=localStorage.getItem('muster-theme')||'';S.customThemes=JSON.parse(localStorage.getItem('muster-custom-themes')||'[]');S.myName=localStorage.getItem('muster-name')||''}catch(e){S.customThemes=[]}applyTheme();S.view='lists';
  const g=groupKey();
  if(!g){document.body.innerHTML='<main style="max-width:420px;margin:20vh auto;padding:16px;text-align:center;font-family:system-ui"><h1>Muster</h1><p>This is a private app. Ask the person who runs your group for the invite link.</p></main>';return}
  render();
  let c;try{c=await fbConnect(g)}catch(e){console.error(e);toast('Could not connect. Check your internet and reload.');render();return}
  S.db=c.db;S.uid=c.uid;const db=c.db;
  sub('detachments','dets');sub('units','units');sub('lists','lists');
  db.doc('core/faq').onSnapshot(s=>{S.faq=(s.exists?s.data().items:null)||[];live()},()=>{});
  db.doc('core/missions').onSnapshot(s=>{S.missions=(s.exists?s.data().rows:null)||{};live()},()=>{});
  db.doc('core/rules').onSnapshot(s=>{const d=s.exists?s.data():{};S.core={stratagems:d.stratagems||[],armyRules:d.armyRules||{}};S.settings={...DEFAULTS,...Object.fromEntries(Object.keys(DEFAULTS).filter(k=>d[k]!=null).map(k=>[k,d[k]]))};live()},()=>{});
  render();
}
