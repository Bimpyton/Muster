<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16191d">
<title>Muster</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Muster">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first dataslate — sticky header, single column of operable panels, fixed bottom tab bar */
:root{
  --bg:#e9ecef;--surface:#fbfcfd;--surface2:#f1f3f5;--ink:#181c21;--muted:#5a636d;--line:#d3d8de;
  --brass:#8a5f12;--brass-ink:#fff8ea;--brass-soft:#f2e6cc;--danger:#a8261d;--danger-soft:#f8e1de;--ok:#2b6e47;--ok-soft:#dcefe3;
  --display:"Saira Condensed","Arial Narrow",sans-serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
  --a-fill:var(--brass);--a-ink:var(--brass-ink);--a-text:var(--brass);--a-soft:var(--brass-soft);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101317;--surface:#191e24;--surface2:#212830;--ink:#e6e9ec;--muted:#98a2ad;--line:#2d353e;
  --brass:#d9a744;--brass-ink:#1a1408;--brass-soft:#372b14;--danger:#ef7468;--danger-soft:#3a1c19;--ok:#6fc893;--ok-soft:#183126;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101317;--surface:#191e24;--surface2:#212830;--ink:#e6e9ec;--muted:#98a2ad;--line:#2d353e;
  --brass:#d9a744;--brass-ink:#1a1408;--brass-soft:#372b14;--danger:#ef7468;--danger-soft:#3a1c19;--ok:#6fc893;--ok-soft:#183126;color-scheme:dark}
/* army accents */
.f-orks{--a-fill:linear-gradient(135deg,#c6ef5e 0%,#71b021 55%,#a5d93b 100%);--a-ink:#122005;--a-text:#3f6b0c;--a-soft:#e5f2d0}
.f-tyranids{--a-fill:linear-gradient(135deg,#a06ad0 0%,#552a7a 55%,#8452b3 100%);--a-ink:#fff;--a-text:#6b3a94;--a-soft:#ece2f4}
.f-dark-angels{--a-fill:linear-gradient(135deg,#3f8f63 0%,#103a25 55%,#2b6d4a 100%);--a-ink:#eef6f1;--a-text:#1b5a3b;--a-soft:#dcebe2}
.f-custodes{--a-fill:linear-gradient(135deg,#f7de7e 0%,#c99a2e 55%,#ecc55c 100%);--a-ink:#2b1e05;--a-text:#86600c;--a-soft:#f6ecd0}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .f-orks{--a-text:#a6dc5c;--a-soft:#223212}
  :root:not([data-theme="light"]) .f-tyranids{--a-fill:linear-gradient(135deg,#b07ddc 0%,#6a399a 55%,#9462c2 100%);--a-text:#c6a3e8;--a-soft:#2c1f3a}
  :root:not([data-theme="light"]) .f-dark-angels{--a-fill:linear-gradient(135deg,#4ea474 0%,#1a5a3a 55%,#36845a 100%);--a-text:#78c9a0;--a-soft:#16291f}
  :root:not([data-theme="light"]) .f-custodes{--a-text:#e8bf55;--a-soft:#382c10}}
:root[data-theme="dark"] .f-orks{--a-text:#a6dc5c;--a-soft:#223212}
:root[data-theme="dark"] .f-tyranids{--a-fill:linear-gradient(135deg,#b07ddc 0%,#6a399a 55%,#9462c2 100%);--a-text:#c6a3e8;--a-soft:#2c1f3a}
:root[data-theme="dark"] .f-dark-angels{--a-fill:linear-gradient(135deg,#4ea474 0%,#1a5a3a 55%,#36845a 100%);--a-text:#78c9a0;--a-soft:#16291f}
:root[data-theme="dark"] .f-custodes{--a-text:#e8bf55;--a-soft:#382c10}
/* app themes (Settings): override base tokens only */
:root.t-void{--bg:#0b0f17;--surface:#121826;--surface2:#1a2233;--ink:#e3e8f2;--muted:#8b97ad;--line:#253049;--brass:#7aa7ff;--brass-ink:#071022;--brass-soft:#1b2b4d;color-scheme:dark}
:root.t-forge{--bg:#141110;--surface:#1d1917;--surface2:#272220;--ink:#efe7e2;--muted:#a69a92;--line:#3a312c;--brass:#ff8a3d;--brass-ink:#1a0c03;--brass-soft:#3d2414;color-scheme:dark}
:root.t-bone{--bg:#ebe8e3;--surface:#f8f6f3;--surface2:#efebe6;--ink:#1f1b18;--muted:#6a625b;--line:#d6d0c8;--brass:#9b1c2c;--brass-ink:#fff4f4;--brass-soft:#f1dadd;color-scheme:light}
:root.t-ice{--bg:#e8eef4;--surface:#f7fafd;--surface2:#edf2f7;--ink:#14202c;--muted:#566677;--line:#cfdae5;--brass:#1f5fbf;--brass-ink:#f2f7ff;--brass-soft:#d8e5f8;color-scheme:light}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
*{box-sizing:border-box}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2rem}h2{font-size:1.35rem}h3{font-size:1.1rem}
p{margin:0}
.eyebrow{font:600 .72rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.875rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{position:relative;background:var(--bg);display:flex;gap:12px;align-items:flex-end;justify-content:space-between;padding-block:18px 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.top .grow{min-width:0;display:grid;gap:6px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--a-fill)}
.top .eyebrow{color:var(--a-text)}
.grp{font:700 .95rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--a-text)}
.top h1{overflow-wrap:anywhere}
.stack{display:grid;gap:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:40px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--a-fill);border-color:transparent;color:var(--a-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.875rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--a-text);outline-offset:2px}
label.f{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);font-size:1rem;font-weight:400}
textarea{min-height:88px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.875rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--a-fill);color:var(--a-ink);border-color:transparent}
.badge{flex:none;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:8px;background:var(--a-fill);color:var(--a-ink);font:700 .85rem/1 var(--display);letter-spacing:.06em}
.badge.s{width:30px;height:30px;font-size:.68rem;border-radius:6px}
.tag{display:inline-flex;align-items:center;border-radius:6px;padding:2px 8px;font-size:.78rem;font-weight:600;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.tag.brass{background:var(--a-soft);border-color:transparent;color:var(--ink)}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.bad{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.card{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card .body{min-width:0;display:grid;gap:4px;flex:1}
.meter{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--a-fill)}
.meter.over i{background:var(--danger)}
.entry{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.entry:first-child,.grp+.entry{border-top:0;padding-top:0}
.entry select{width:auto;min-width:0;max-width:100%;padding:6px 8px;font-size:.9rem}
.warn{display:grid;gap:6px;padding:0;margin:0;list-style:none}
.warn li{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 10px;font-size:.9rem;font-weight:600}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;display:grid;gap:10px;justify-items:start;color:var(--muted)}
.empty h3{color:var(--ink)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.tabs nav{display:flex;gap:4px;width:100%;max-width:760px;justify-content:space-between}
.tabs button{appearance:none;border:0;background:transparent;border-radius:999px;padding:10px 12px;font:700 .9rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px;flex:0 0 auto;transition:background .15s,color .15s}
.tabs button svg{width:22px;height:22px;flex:none}
.tabs button span{display:none}
.tabs button[aria-current=page]{background:var(--brass-soft);color:var(--ink);flex:1 1 auto;justify-content:center}
.tabs button[aria-current=page] span{display:inline}
.tabs button[aria-current=page] svg{color:var(--brass)}
.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding-block:10px 6px;max-width:760px;margin:0 auto;padding-inline:16px}
.searchbar input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px 10px 40px;font-size:1rem;color:var(--ink)}
.searchbar .sicon{position:absolute;left:30px;top:21px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.results{position:absolute;left:16px;right:16px;top:calc(100% - 2px);background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:60vh;overflow:auto;box-shadow:0 12px 30px rgb(0 0 0 / .25);padding:6px}
.results p.grp{padding:8px 10px 4px;margin:0}
.res{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.res:hover,.res:focus-visible{background:var(--surface2)}
.res .body{min-width:0;display:grid}
.res small{color:var(--muted)}
.cat{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.cat:first-of-type{border-top:0;padding-top:0}
.cat-h{display:flex;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);width:100%;text-align:left}
.cat-h h3{font:700 1.45rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;border-left:5px solid var(--a-text);padding-left:10px;color:var(--a-text)}
.gslot{display:grid;gap:6px}
.gslot>p{margin:0}
.msec{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.msec-h{background:#1d2b44;color:#fff;font:700 .95rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:8px 10px}
.msec.act .msec-h{background:#b98a1a;color:#1a1305}
.mwhen{padding:7px 10px;border-bottom:1px solid var(--line);font-size:.88rem}.mwhen b{text-transform:uppercase;font-size:.75rem;letter-spacing:.08em;margin-right:6px;background:var(--ink);color:var(--surface);padding:2px 6px;border-radius:4px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 10px;font-size:.9rem}
.mrow+.mrow{border-top:1px dashed var(--line)}
.mrow .vp{flex:none;font:700 1.1rem/1 var(--mono);text-align:right;display:grid;justify-items:end;gap:2px}.mrow .vp small{font:600 .6rem/1 var(--mono);text-transform:uppercase;color:var(--muted)}
.mrow.cum{background:var(--surface2)}.plus{color:var(--a-text)}
.mor{text-align:center;font:700 .7rem/1 var(--mono);text-transform:uppercase;color:var(--muted);padding:2px}
.mpre{font-style:italic;font-size:.88rem;border-left:3px solid var(--a-text);padding-left:10px;margin:0}
.mact{padding:8px 10px;display:grid;gap:4px;font-size:.88rem}.mact p{margin:0}
.radios{display:grid;gap:4px}
.radios label{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.radios input{accent-color:var(--a-text);width:18px;height:18px;margin:0}
.faq{margin:0;padding-left:20px;display:grid;gap:8px}
.mission .cat-h h3{font-size:1.1rem}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cat-h .chev{transition:transform .15s;color:var(--muted)}
.cat.closed .chev{transform:rotate(-90deg)}
.cat-count{font:600 .8rem/1 var(--mono);color:var(--muted)}
.rulebox{background:#fff;color:#1b1f24;border:1px solid #d3d8de;border-radius:var(--r);padding:14px;display:grid;gap:10px;color-scheme:light}
.rulebox details>summary{color:#1b1f24}
.rulebox h2,.rulebox h3,.rulebox strong{color:#111418}
.rulebox p,.rulebox .rules{color:#2a3038}
.rulebox .num{color:#6b7480}
.rule-item{display:grid;gap:3px;padding-block:6px;border-top:1px solid #e5e8ec}
.rule-item:first-child{border-top:0}
.gear{display:grid;gap:6px;background:var(--surface2);border-radius:8px;padding:10px}
.gear label{display:flex;gap:8px;align-items:center;font-size:.92rem}
.gear ul{margin:0;padding-left:18px;font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.flash{animation:flash 1.4s ease-out}@keyframes flash{0%{box-shadow:0 0 0 3px var(--brass)}100%{box-shadow:0 0 0 3px transparent}}}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.theme{border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;display:grid;gap:8px;text-align:left;background:var(--surface);color:var(--ink)}
.theme[aria-pressed=true]{border-color:var(--brass)}
.theme .sw{display:flex;height:34px;border-radius:8px;overflow:hidden}
.theme .sw i{flex:1}
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;position:sticky;top:0;z-index:15;background:var(--bg);padding:6px 0;margin-inline:-2px}
.score .ctr{padding:6px 4px;gap:4px}.score .ctr .v{font-size:1.5rem}.score .eyebrow{font-size:.65rem}
@media (min-width:560px){.score{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ctr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:6px;justify-items:center}
.ctr .v{font:600 2rem/1 var(--mono);font-variant-numeric:tabular-nums}
.ctr .row{flex-wrap:nowrap}
.ctr .btn{min-width:40px;justify-content:center;padding:4px}
.seg{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:7px;padding:8px 10px;font:600 .9rem/1 var(--body);cursor:pointer;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:inset 0 -3px 0 var(--a-text),0 1px 2px rgb(0 0 0 / .15)}
/* stratagem timing colours: fixed, independent of theme and army */
.strat{--sc:#2563c9;--sl:#dce8fc;--st:#1a4ea6;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;background:var(--surface)}
.strat.s-opp{--sc:#c3362b;--sl:#fbe1de;--st:#9c271e}
.strat.s-either{--sc:#0f8a72;--sl:#d4f1e9;--st:#0b6a57}
.strat .sh{background:var(--sc);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.strat>summary{list-style:none;cursor:pointer}
.strat>summary::-webkit-details-marker{display:none}
.strat>summary::before{content:none}
.strat .chev{transition:transform .15s;margin-left:6px}
.strat[open] .chev{transform:rotate(180deg)}
.strat .sb{color:var(--ink)}
.disp-take{--dc:#2f8a3b}.disp-disr{--dc:#1f6aa5}.disp-purge{--dc:#a5232c}.disp-prio{--dc:#b8901c}.disp-recon{--dc:#13808a}
.tag.disp{background:var(--dc);color:#fff;border-color:transparent}
.chip.disp[aria-pressed=true]{background:var(--dc);color:#fff}
.strat .sh h3{color:inherit}
.strat .sh small{display:block;opacity:.85;font-size:.78rem;font-weight:600;letter-spacing:.04em}
.strat .sb{padding:10px 12px;display:grid;gap:8px}
.strat.used{opacity:.55}
.strat .cp{font:700 1.25rem/1 var(--mono);color:inherit;white-space:nowrap}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.rules{white-space:pre-wrap;font-size:.93rem;overflow-wrap:anywhere}
.statline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:center}
.statline div{padding:4px 2px;border-left:1px solid var(--line)}
.statline div:first-child{border-left:0}
.statline b{display:block;font:600 .66rem/1.2 var(--body);letter-spacing:.08em;color:var(--muted)}
.statline span{font:600 .95rem/1.3 var(--mono)}
.unit.dead{opacity:.5}.unit.dead h3{text-decoration:line-through}

.wtab-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.wtab{width:100%;border-collapse:collapse;font-size:clamp(.66rem,2.9vw,.85rem);table-layout:fixed}
.wtab th:not(:first-child),.wtab td:not(:first-child){width:9.5%;padding-inline:1px}
.wtab th:nth-child(2),.wtab td:nth-child(2){width:12%}
.wtab td:first-child{overflow-wrap:anywhere}
.wtab th{font-size:clamp(.55rem,2.4vw,.7rem)!important;letter-spacing:.02em!important}
.wtab th{font:700 .7rem/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--a-ink);background:var(--a-fill);padding:6px 6px;text-align:center}
.wtab th:first-child{text-align:left}
.wtab td{padding:6px;border-top:1px solid var(--line);text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums;vertical-align:top}
.wtab td:first-child{text-align:left;font-family:var(--body);font-weight:600}
.sparts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:.9rem;line-height:1.4}
.sparts dt{font:700 .72rem/1.6 var(--display);letter-spacing:.1em;color:inherit;opacity:.85;padding-top:1px}
.sparts dd{margin:0;white-space:pre-line}
.sparts dd.note{grid-column:1/-1;font-style:italic}
.kwb{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-underline-offset:2px;cursor:pointer}
#kwpop{position:fixed;z-index:40;max-width:min(340px,calc(100vw - 24px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 10px 30px rgb(0 0 0 / .35);font-size:.88rem;line-height:1.4}
#kwpop b{display:block;margin-bottom:4px}
.abil h4{font:700 .8rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--a-text);margin:10px 0 6px}
.abil h4:first-child{margin-top:0}
.abil .chips2{display:flex;flex-wrap:wrap;gap:6px}
.abil .chips2 .kwb{border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none;background:var(--surface2)}
.abil p{margin:0 0 6px}
.wcount{font-family:var(--mono);color:var(--a-text);margin-right:4px}
.wtab td small{display:block;font-weight:400;color:var(--a-text);font-size:.75rem;letter-spacing:.02em}
.wgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.wgrid.m{grid-template-columns:repeat(5,minmax(0,1fr))}
details>summary{cursor:pointer;font-weight:600;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";color:var(--muted)}
details[open]>summary::before{content:"▾ "}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;background:var(--surface2)}
.item input,.item select,.item textarea{background:var(--surface)}
[hidden]{display:none!important}
.sheet{position:fixed;inset:0;z-index:20;background:rgb(8 10 12 / .55);display:flex;align-items:flex-end;justify-content:center}
.sheet .pane{background:var(--surface);width:100%;max-width:760px;max-height:85%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start}
.pick{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.pick:disabled{opacity:.45;cursor:not-allowed}
.pick .body{min-width:0;display:grid;gap:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;max-width:calc(100% - 32px)}
.notice{background:var(--brass-soft);border-radius:var(--r);padding:12px;font-size:.92rem}
pre{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto;font:500 .8rem/1.5 var(--mono);margin:0}
@media (prefers-reduced-motion:no-preference){.sheet .pane{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

body{line-height:1.6}
.rules{line-height:1.65;font-size:.95rem}
.stack{gap:18px}
.panel{gap:14px;padding:16px;border-color:color-mix(in srgb,var(--line) 70%,var(--a-text))}
.panel>h2,.panel-head>h2{font-size:1.25rem;color:var(--a-text);padding-bottom:6px;border-bottom:2px solid color-mix(in srgb,var(--a-text) 35%,transparent)}
.entry{border:1px solid var(--line);border-left:4px solid var(--a-text);border-radius:10px;padding:12px 12px 12px 14px;background:color-mix(in srgb,var(--surface) 92%,var(--a-text));gap:10px;margin-bottom:4px}
.entry:first-child,.grp+.entry{border-top:1px solid var(--line);padding-top:12px}
.cat{gap:14px;border-top:0;padding-top:6px}
.cat+.cat{margin-top:10px}
.panel.unit{border-left:4px solid var(--a-text);background:color-mix(in srgb,var(--surface) 94%,var(--a-text));margin-bottom:6px}
.panel.unit h3{font-size:1.2rem}
.sec{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.sec>summary{padding:10px 12px;background:color-mix(in srgb,var(--a-text) 14%,var(--surface));font:700 .85rem/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--a-text)}
.sec>summary::before{color:var(--a-text)}
.sec[open]>summary{border-bottom:1px solid var(--line)}
.sec-b{padding:12px;display:grid;gap:10px;line-height:1.6}
.sec-b .wtab-wrap{border:0;border-radius:0;margin:-12px}
.abil{font-size:.93rem}
.abil p{margin:0 0 10px;line-height:1.6}
.abil h4{margin:14px 0 8px;padding-bottom:4px;border-bottom:1px dashed var(--line)}
.sparts{line-height:1.6;gap:8px 12px}
.strat{margin-bottom:6px}
.wtab td{padding-block:8px}
.wtab tbody tr:nth-child(even){background:color-mix(in srgb,var(--a-text) 6%,transparent)}
.gear{border:1px dashed var(--line)}

.mod,.statline div.mod span,.wtab td.mod{color:var(--a-text)!important;font-weight:800}
.statline div.mod{background:color-mix(in srgb,var(--a-text) 16%,transparent)}
.wtab td.mod{background:color-mix(in srgb,var(--a-text) 12%,transparent)}
.modt{color:var(--a-text)}
.eopt .kwb{text-align:left}
.eopt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid transparent}
.eopt.on{background:color-mix(in srgb,var(--ink) 18%,var(--surface));border-color:var(--a-text)}
.eopt.dis{opacity:.5}
.agrp{border:2px solid color-mix(in srgb,var(--a-text) 45%,transparent);border-radius:14px;padding:10px;display:grid;gap:10px}
.agrp-h{margin:0;font:700 1rem/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--a-text)}
h1,h2,h3,strong,.card h3,.entry strong{overflow-wrap:anywhere;word-break:break-word;min-width:0}
.row.between>*{min-width:0}
.card .body{min-width:0}
.card .row.between{flex-wrap:wrap}
</style>

<script>
const FACTIONS=[
  {id:'custodes',name:'Adeptus Custodes',abbr:'ADC'},
  {id:'dark-angels',name:'Dark Angels',abbr:'DA'},
  {id:'orks',name:'Orks',abbr:'ORK'},
  {id:'tyranids',name:'Tyranids',abbr:'TYR'}];
const CORE_RULES=[{"id": "r01", "num": "01", "title": "Core Concepts", "items": [["Armies and control", "Each player has an army built from units of models, and you control every model in your army. A rule mentioning the 'controlling player' means whoever controls the models that rule affects."], ["Units and models", "A unit is one or more models that move and fight as a group. A model's base counts as part of the model for every rule. 'Friendly' means in your army and 'enemy' means in your opponent's; a rule that names neither applies to units and models from both armies. An effect that applies to a unit applies to each model in it."], ["Active and opposing player", "At every moment one player is active and the other is opposing. During your turn you are normally active, with two exceptions: while a unit is moving, its controlling player is active until that move finishes; and while a unit has been selected to shoot or fight, its controlling player is active until all of its attacks are resolved. When it is nobody's turn (such as the start or end of a battle round), the player who takes the first turn of each round counts as active."], ["Measuring", "All distances are in inches and you may measure whenever you like. Unless a rule says otherwise, measure to and from the closest point of a model's base (Frame models are an exception, see Monsters and Vehicles)."], ["Dice", "D6 is a six-sided die. 'X+' means a result of X or higher; a range like 1-3 means any result in that range. 2D6, 3D6 etc. means roll that many dice and total them. D3 means roll a D6, halve it and round up. D6+1, 2D6+3 etc. means roll the dice and add the number."], ["Leadership rolls", "Roll 2D6 for the unit. If the total is equal to or higher than at least one Ld value among its models, the roll succeeds; otherwise it fails. The rule calling for the roll tells you what success or failure does."], ["Battle-shock rolls", "A battle-shock roll is a leadership roll. Success: the unit doesn't become battle-shocked. Failure: the unit and all of its models become battle-shocked."], ["Being battle-shocked", "While battle-shocked, every model in the unit has OC '-', its own player can't target it with stratagems, it can't start an action, and any action it already started can't be completed. It stays battle-shocked until it passes a battle-shock roll in its Command phase."]]}, {"id": "r02", "num": "02", "title": "Datasheets", "items": [["Datasheet name and abilities", "Each unit has a datasheet naming the unit and listing any abilities it can use during the game."], ["Profiles", "M (Move): how far the model moves; M of '-' means it can be set up but never moved afterwards. T (Toughness): how hard it is to wound. Sv (Save): armour save as a dice result, e.g. 4+. InSv (Invulnerable save): a second save some models have, also a dice result. W (Wounds): damage it can take; at 0 or fewer it is destroyed. Ld (Leadership): a dice result such as 7+ used for leadership and battle-shock rolls. OC (Objective Control): its value for controlling objectives; OC '-' means it can't control objectives at all."], ["Weapons", "Range: how far a ranged weapon reaches; 'Melee' means a melee weapon. A (Attacks): attack dice rolled each time the weapon is used. BS (Ballistic Skill) for ranged or WS (Weapon Skill) for melee: hit roll needed, e.g. 3+. S (Strength): compared to Toughness for wounding. AP (Armour Penetration): a negative modifier applied to the target's save roll. D (Damage): wounds lost per unsaved attack."], ["Keywords", "Datasheets list faction keywords and other keywords. Faction keywords matter when choosing what goes in your army; otherwise both kinds work identically. A rule tied to a keyword (e.g. 'Infantry units') only affects units that have it. Singular and plural forms of a keyword are the same keyword."], ["Unit composition and other rules", "Shows how many models of each type the unit contains and the default wargear each model carries. It can also list things like which bodyguard units a leader can join or which units can embark in a Transport."], ["Wargear options", "Some datasheets offer options; when you add the unit to your army you may use them to change the weapons and other wargear its models carry."]]}, {"id": "r03", "num": "03", "title": "Moving", "items": [["Move types", "Every kind of move (normal, advance, fall-back, charge, pile-in, consolidation, disembark, emergency disembark, ingress, scout, surge) defines which units may make it, its maximum distance or set-up distance, and any conditions that apply before, while or after moving."], ["Moving models", "When a unit moves, move whichever of its models you want, one at a time, using any number of straight-line moves and rotations. Unless a rule says otherwise a model may pass through friendly models and through any gap its base fits through, but its base may not pass through enemy models or cross the battlefield edge, and any 'While Moving' conditions must be respected."], ["Distance moved", "Each straight-line move is horizontal; measure it from the same point on the base before and after, and add it to the distance that model has already moved during this move. The total may not exceed the move's maximum. Rotating a model about the centre of its base (keeping it upright) costs no distance. Vertical movement on terrain also counts (see Terrain)."], ["Ending a move", "Once you have finished moving or setting up the unit's models, check: the unit (if on the battlefield) is in coherency; no model is standing on another model or partly through a terrain surface such as a wall or ceiling; and every 'After Moving' condition is met. If any check fails, the move can't be made: return all models to where they started. Otherwise resolve any extra 'After Moving' effects and the move ends."], ["Setting up", "Whenever a rule tells you to set up a unit, place its models so the unit is in coherency, is unengaged, and meets every other requirement. If you can't place all of them, take the unit off and put it back where it came from (e.g. strategic reserves or inside its Transport). If this happens during a move type, the unit counts as not having been selected for that move, so it can be selected again later (to try again or remain stationary)."], ["Coherency", "A unit of two or more models must be set up and finish every move in coherency. That means every model is within 2\" horizontally and 5\" vertically of at least one other model in the unit, and within 9\" horizontally and 5\" vertically of every other model in the unit."], ["Regaining coherency", "In the End of Turn step of each player's turn, any unit on the battlefield that is out of coherency must have models removed by its controller, one at a time, until it is back in coherency. Those models are destroyed, but they don't trigger rules that happen when a model is destroyed."], ["Engagement", "A model's engagement range is 2\" horizontally and 5\" vertically around it. When a model is within engagement range of an enemy model, those models and their units are engaged with each other. A unit with no engaged models is unengaged."]]}, {"id": "r04", "num": "04", "title": "Making Attacks", "items": [["Sequence", "Whenever a unit shoots or fights, the active player: 1) selects weapons, 2) selects targets, 3) resolves attacks."], ["Models without weapons", "A model with no ranged weapons can't make ranged attacks, and one with no melee weapons can't make melee attacks."], ["Select weapons", "Choose weapons for each model in the attacking unit; ranged weapons make ranged attacks and melee weapons make melee attacks. When shooting, pick one or more of the model's ranged weapons (subject to [Close-Quarters] limits). When fighting, pick exactly one of the model's melee weapons (plus any [Extra Attacks] weapons)."], ["Select targets: shooting", "For each chosen ranged weapon, pick one enemy unit as its target. Unless a rule says otherwise, the target must be visible to the model with that weapon, within the weapon's range, and unengaged. Different weapons can pick different targets. A weapon with no legal target, or that you choose not to aim at anything, makes no attacks."], ["Select targets: fighting", "For each chosen melee weapon, pick one or more enemy units engaged with that model, up to a maximum number of targets equal to the weapon's A. If you pick more than one, declare how many of the weapon's attacks go into each (at least one per target)."], ["Resolve attacks", "1) Pick one enemy unit that is being targeted. 2) Pick one weapon aimed at it that hasn't attacked it yet and gather D6 equal to its A (only the declared share if it split melee attacks). Also gather dice now for every other unused weapon aimed at that unit that makes identical attacks. 3) Run the attack sequence for all gathered dice. 4) If weapons aimed at the same unit still haven't attacked, go back to step 2; otherwise if weapons aimed at another unit remain, go back to step 1; otherwise the unit's attacks are done."], ["Identical attacks", "Attacks are identical when they share the same BS/WS, S, AP and D and are affected by exactly the same abilities and rules."]]}, {"id": "r05", "num": "05", "title": "Attack Sequence", "items": [["Overview", "Run these steps in order: hit rolls, wound rolls, save rolls, inflict damage. Roll all dice for a step at the same time. An attack's sequence ends once it fails or inflicts damage."], ["1. Hit rolls", "Roll one D6 per attack dice and use the first result that applies: an unmodified 1 always fails; an unmodified 6 is a critical hit; a result equal to or above the attack's BS/WS is a hit; anything else fails."], ["2. Wound rolls", "Roll one D6 per hit and use the first result that applies: an unmodified 1 always fails; an unmodified 6 is a critical wound; a result at or above the required number wounds; anything else fails."], ["Wound table", "Compare the attack's S with the target's T. S at least twice T: 2+. S greater than T: 3+. S equal to T: 4+. S less than T: 5+. S half T or less: 6+."], ["Critical hits and wounds", "A critical hit is still a hit and a critical wound is still a wound; criticals can additionally trigger rules such as [Lethal Hits], [Sustained Hits] and [Devastating Wounds]."], ["3. Save rolls: groups", "The defending player splits the target unit into allocation groups: each Character model forms its own group, and all other models with identical W, Sv and InSv form a group together."], ["3. Save rolls: allocation order", "The defender then declares the order groups receive attacks, with these limits: a non-Character group containing a model that has lost wounds must be first; no Character group can come before any non-Character group; Character groups containing a wounded model must come before Character groups with no wounded models. The first group in the order is the current allocation group; when every model in it is destroyed, the next group becomes current."], ["3. Save rolls: rolling", "The defender rolls one D6 save for each attack that wounded."], ["4. Inflict damage", "Take the save rolls one at a time, from the lowest result upwards, until all are resolved or the target unit is wiped out (leftover attacks are lost). For each: select a model in the current allocation group, choosing one that has already lost wounds if possible; then check the roll."], ["Checking the save", "Use the first case that applies: an unmodified 1 inflicts damage; if the group's models have an InSv and the roll equals or beats it, the attack fails; if the roll, after applying the weapon's AP, equals or beats the group's Sv, the attack fails; otherwise it inflicts damage. Example: with AP -1, a roll of 3 counts as 2, so it only saves against Sv 2+. The InSv is never modified by AP."], ["Resolving damage", "When an attack inflicts damage, the selected model loses wounds equal to the attack's D. If it drops to 0 or fewer wounds it is destroyed."]]}, {"id": "r06", "num": "06", "title": "Other Concepts", "items": [["Line of sight", "A model can see another if an imaginary straight line 1 mm wide can be traced from any part of the observer to any part of the other model. Ignore other models belonging to the observer's unit and the observed model's unit when doing this. Terrain adds further visibility rules (see Terrain)."], ["Visible and fully visible", "A model is visible if any part of it can be seen, and fully visible if every part facing the observer can be seen (only the model itself blocks it). A unit is visible if at least one of its models is visible, and fully visible if all of its models are fully visible (the observer can see through other models of that same unit when checking)."], ["Mortal wounds", "For each mortal wound, until all are applied or the unit is destroyed: choose a model by the first applicable rule — a non-Character model that has lost wounds; otherwise any non-Character model; otherwise a Character model that has lost wounds; otherwise any Character model. That model loses 1 wound and is destroyed at 0. Mortal wounds ignore saves."], ["Mortal wounds with normal damage", "If a batch of attack dice produces both normal damage and mortal wounds, apply all normal damage first, then all mortal wounds."], ["Hazard rolls", "Roll a D6 for the unit: on 1-2 it fails and the unit suffers 1 mortal wound, or 3 mortal wounds if every model in the unit is a Monster or Vehicle. When several hazard rolls are needed for one unit, roll them all at once."]]}, {"id": "r07", "num": "07", "title": "The Battle Round", "items": [["Structure", "A battle is a series of battle rounds (usually five, as set by the mission). Each round: 1) Start of battle round: resolve rules triggered then. 2) Player turns: each player takes one turn; the same player always goes first every round, as the mission specifies. 3) End of battle round: resolve end-of-round rules."], ["Ordering end steps", "At the end of a battle round, a turn or a Command phase, first resolve triggered rules that aren't mission rules, then both players check their mission and resolve anything they achieved at that point."], ["A turn", "Each turn has seven parts in order: Start of Turn step, Command phase, Movement phase, Shooting phase, Charge phase, Fight phase (both players' units fight), End of Turn step (regain coherency here)."]]}, {"id": "r08", "num": "08", "title": "Command Phase", "items": [["Steps", "1) Start of Command phase, 2) Gain Core CP, 3) Battle-shock, 4) Command abilities, 5) End of Command phase (non-mission rules, then mission scoring)."], ["Gain Core CP", "Both players gain 1 Command Point. These are normal CP; other rules may call them Core CP."], ["Battle-shock", "The active player must make a battle-shock roll for every unit in their army that is currently battle-shocked and/or is at or below half-strength. A unit that started this step battle-shocked and passes its roll is no longer battle-shocked; one that fails stays (or becomes) battle-shocked."], ["Command abilities", "Rules that happen in the Command phase are resolved here, other than those triggered at the start or end of the phase, on gaining Core CP, or by battle-shock rolls."]]}, {"id": "r09", "num": "09", "title": "Movement Phase", "items": [["Steps", "1) Start of Movement phase, 2) Move units, 3) End of Movement phase."], ["Moving units", "The active player selects their units one at a time — including units in strategic reserves and units embarked in Transports — and picks a move type the unit is eligible for: remain stationary, normal, advance, fall-back, disembark, ingress, or one granted elsewhere. By the end of the step every unit must have been selected, even if only to remain stationary."], ["Remain stationary", "Any unit can. No model moves or rotates, and rules triggered by a unit starting or ending a move don't trigger."], ["Normal move", "Unit must be on the battlefield and unengaged. Move up to the unit's M. After moving it must be unengaged."], ["Advance move", "Unit must be on the battlefield and unengaged. Before moving, roll a D6 (advance roll); maximum distance is M plus the roll. After moving it must be unengaged, and unless a rule says otherwise it can't declare a charge or start an action for the rest of the turn (it can only shoot via assault shooting)."], ["Fall-back move", "Unit must be engaged. Maximum distance is M. Before moving choose a mode: Ordered Retreat is available if the unit isn't battle-shocked (you may still choose Desperate Escape); otherwise Desperate Escape is mandatory. Desperate Escape: make a hazard roll for every model before moving, and models may move through enemy models."], ["After falling back", "The unit must end unengaged. Until the end of the turn, unless a rule says otherwise, it can't shoot, declare a charge or start an action. After a Desperate Escape, if the unit isn't already battle-shocked, it must make a battle-shock roll."], ["Modes", "When a move offers modes, check them in the order listed; they are mutually exclusive. If a unit qualifies for none, it can't make that move. Conditions labelled with a mode only apply when that mode was chosen; unlabelled conditions always apply."]]}, {"id": "r10", "num": "10", "title": "Shooting Phase", "items": [["Steps", "1) Start of Shooting phase, 2) Shoot, 3) End of Shooting phase."], ["Shoot", "The active player picks eligible units one at a time and resolves each one's attacks before picking the next. A unit is eligible if it is on the battlefield and hasn't been selected to shoot this phase (rules like falling back or starting an action can remove eligibility). Choose a shooting type the unit qualifies for and resolve it. Shooting is optional."], ["Normal shooting", "Unit must be unengaged and must not have made an advance move this turn. Shoot using the Making Attacks rules. Afterwards it can't start an action this phase."], ["Assault shooting", "Unit must be unengaged, have made an advance move this turn, and have at least one [Assault] weapon. Only [Assault] weapons can be selected. Afterwards it can't start an action this phase."], ["Close-quarters shooting", "Unit must be engaged, must not have advanced this turn, and must either have a [Close-Quarters] weapon or be a Monster/Vehicle unit. Models may target enemy units their unit is engaged with. Afterwards it can't start an action this phase."], ["Close-quarters: Monsters and Vehicles", "Monster/Vehicle models may fire any of their ranged weapons. Each of their attacks suffers -1 to the hit roll unless it is a [Close-Quarters] weapon aimed at a unit their unit is engaged with. Their [Blast] weapons still can't target units their unit is engaged with."], ["Close-quarters: other models", "Models that aren't Monsters or Vehicles may only select [Close-Quarters] weapons, and may only target enemy units engaged with their unit."], ["Indirect shooting", "Unit must be unengaged, must not have advanced this turn, and must have at least one [Indirect Fire] weapon. Its [Indirect Fire] weapons may target units that aren't visible to the firer. For every attack by an [Indirect Fire] weapon: the target has the benefit of cover; hit rolls can't be re-rolled; and an unmodified hit roll of 1-5 fails, unless the unit remained stationary this turn and the target is visible to at least one friendly unit, in which case only 1-3 fails. The unit's other weapons can still shoot visible targets as normal. Afterwards it can't start an action this phase."]]}, {"id": "r11", "num": "11", "title": "Charge Phase", "items": [["Steps", "1) Start of Charge phase, 2) Charge, 3) End of Charge phase. The active player resolves charges one unit at a time, for as many eligible units as they wish."], ["Eligibility", "A unit on the battlefield may declare a charge unless: it isn't within 12\" of any enemy unit, it is engaged, or it made an advance or fall-back move this turn (other rules, e.g. starting an action or a rapid/combat disembark, can also prevent it)."], ["Declaring and rolling", "Select an eligible unit that hasn't declared a charge this phase; it declares a charge. Roll 2D6: the total is the charge move's maximum distance. If a charge move is possible and you still want to, make it; otherwise the unit doesn't move. Either way that charge is resolved."], ["Charge targets", "Before moving, select one or more enemy units that are within 12\" of your unit and within the rolled distance; they are the charge targets for this move."], ["While moving", "Each model must end closer to at least one charge target. Any model that can end within 1\" of a charge target must, and any model that can end engaged with a charge target must."], ["After moving", "Your unit must be engaged with every charge target and must not be engaged with any enemy unit that isn't a charge target; if this can't be achieved the move can't be made and the charge fails. Until the end of the turn, every model in the unit has Fights First."], ["Charge roll of 2", "Without modifiers, a roll of 2 can never succeed, because a unit can't already be within engagement range (2\") when it declares a charge."]]}, {"id": "r12", "num": "12", "title": "Fight Phase", "items": [["Steps", "1) Start of Fight phase, 2) Pile in, 3) Fight, 4) Consolidate, 5) End of Fight phase. Every unit that can fight must fight; piling in and consolidating are optional."], ["Pile in step", "Both players make pile-in moves with any eligible units they want — the player whose turn it is moves all of theirs first, then the opponent. Each unit makes at most one pile-in move in this step."], ["Pile-in move", "Up to 3\". Eligible in the Fight phase if the unit is engaged, made a charge move this turn, or was selected for an overrun fight this phase. Pile-in targets: if engaged, every enemy unit it is engaged with; otherwise one or more enemy units within 5\"."], ["Pile-in: moving", "Models in base contact with an enemy model can't be moved. Every model that moves must end closer to the closest pile-in target, and engaged with it if possible. Afterwards the unit must be engaged, and every model that began engaged with an enemy unit must still be engaged with that unit."], ["Eligible to fight", "A unit that hasn't fought yet this phase is eligible if it is engaged, was engaged at the start of the Fight step, or made a charge move this turn."], ["Fights First step", "Starting with the player whose turn it is, players alternate selecting one of their eligible Fights First units to fight. If a player has none available but the other does, the other player selects again. When no eligible Fights First units remain, move to the remaining combats; the player whose turn it was to choose picks first there."], ["Remaining combats step", "Players alternate selecting any eligible unit to fight, starting with the player who moved the sequence to this step. If one player has no eligible units, the other keeps selecting. When nothing is eligible, the Fight step ends. After each fight here, if any Fights First unit has become eligible, go back to the Fights First step."], ["Fight types", "When a unit is selected to fight, choose a fight type it qualifies for. Normal fight: unit is engaged; it attacks per Making Attacks. Overrun fight: unit is unengaged, or was unengaged at the start of the Fight step but has since become engaged; it makes one extra pile-in move and then attacks. A unit must still be eligible to fight to make an overrun fight."], ["Overrun engagements", "An overrun pile-in can engage enemy units that were unengaged; those units become eligible to fight this phase (and may be next if they are Fights First)."], ["Unable to fight", "When it's a player's turn to pick a unit to fight but all their eligible units are more than 5\" from every enemy unit, they may pass to their opponent. If both pass one after the other, or one passes while the other has no eligible units left, the Fight step ends."], ["Consolidate step", "Both players make consolidation moves with any eligible units they want, the player whose turn it is first. Each unit consolidates at most once. Eligible: the unit was eligible to fight this phase. Up to 3\"."], ["Consolidation modes", "Pick the first that applies (mandatory). Ongoing: the unit is engaged — select every enemy unit it is engaged with. Engaging: otherwise, if within 3\" of an enemy unit — select one or more of those units. Objective: otherwise, if within 3\" of an objective — select one of them. If none apply, the unit can't consolidate."], ["Ongoing consolidation", "Models in base contact with enemies can't move; others must end closer to the closest selected enemy unit and engaged with it if possible. Every model that started engaged with an enemy unit must still be engaged with that unit."], ["Engaging consolidation", "Each moving model must end closer to the closest selected enemy unit and engaged with it if possible. Afterwards your unit must be engaged with every selected unit. Then any enemy units engaged with yours that haven't fought this phase are selected by your opponent, one at a time, and each immediately becomes eligible to fight and fights."], ["Objective consolidation", "Each moving model must end within range of the selected objective if it can, otherwise closer to it. Afterwards the unit must be within range of that objective."]]}, {"id": "r13", "num": "13", "title": "Terrain", "items": [["Terrain areas", "Before the battle, terrain is placed in one of three ways: features placed wholly within a clear boundary such as a mat or base; a single feature placed on the battlefield; or several features that together outline an area. The space covered by that boundary or feature is a terrain area. The mission's deployment map may set terrain areas; otherwise players agree on them before the battle."], ["Categories", "Every terrain feature is Exposed (e.g. craters, razorwire, debris), Light (e.g. barricades, low walls, statues) or Dense (e.g. buildings, ruins, containers, woods). Features in one terrain area can be of different categories."], ["Movement: exposed and light", "Any model can move horizontally and vertically through exposed and light features."], ["Movement: dense", "Infantry, Beasts, Swarm and Mobile models can move horizontally through dense features; Infantry, Beasts and Swarm can also move vertically through them. Any other model can only move horizontally through a dense feature if every section its base passes over is 2\" tall or less; otherwise it must climb up and down those sections, can't pass through floors or ceilings doing so, and can't end the move on any non-ground-level surface of that feature."], ["Moving vertically", "Climbing up or down a feature, the model must stay within ½\" horizontally of it, and the vertical distance up and down is added to the distance moved."], ["Upper levels", "Any model can be set up or end a move at ground level in terrain. To be set up or end on a surface above ground level, the model must be Infantry, Beasts, Swarm, Fly or Monster, must be stable, and no part of its base may overhang the edge of that surface."], ["Benefit of cover", "Against a ranged attack, a unit has the benefit of cover if each of its models either is Infantry, Beasts or Swarm within a terrain area, or is not fully visible to the attacker because of intervening terrain features and/or intervening obscuring terrain areas. Cover worsens the attack's BS by 1."], ["Hidden", "A model is hidden while it is Infantry, Beasts or Swarm inside a terrain area containing at least one dense feature, and its unit made no ranged attacks this turn or the previous turn. A hidden model can only be visible to enemy models within its detection range, which is 15\" unless stated otherwise."], ["Obscuring", "A terrain area containing any light or dense feature is obscuring. If every line of sight between two models crosses an obscuring area (other than one either model is inside), the two models can't see each other."], ["Solid", "Dense features are Solid: line of sight can't pass through any enclosed gap (door, window, hole) in them 3\" or less above ground level. Models also can't end a move with any part of them poking through such an enclosed part of the feature."], ["Plunging fire", "See Other Rules and Abilities: +1 BS when firing from terrain 3\"+ high, or from a Towering model within 12\", at a visible unit with models on ground level. Never applies to attacks by or against Aircraft."]]}, {"id": "r14", "num": "14", "title": "Objectives", "items": [["Terrain objectives", "The mission shows where objectives go; each point should sit in a terrain area, and that whole terrain area is the objective. A model is in range of a terrain objective while it is inside that terrain area. Measure to and from the objective's closest point."], ["Level of control", "No one controls any objective at the start of the battle. At the end of every phase and every turn, each player totals the OC of all their models in range of the objective. The higher total controls it. On a tie, neither player controls it unless it is secured. Only models with OC 1+ contribute (battle-shocked models have OC '-')."], ["Controlling units", "A unit in range of an objective its player controls, containing at least one model with OC 1+, is said to be controlling that objective."], ["Secured objectives", "Some rules let your army secure an objective. It then stays under your control, even with none of your models near it, until at the end of some phase your opponent's level of control over it is higher than yours."], ["Objective markers", "If an objective's point isn't in a terrain area, mark it with a flat round 40 mm marker centred on the point. Models can move over and end on markers. A model is in range within 3\" horizontally and 5\" vertically of the marker, measured to its closest part."]]}, {"id": "r15", "num": "15", "title": "Stratagems", "items": [["Using stratagems", "Either player can use stratagems. Each lists its CP cost, WHEN it can be used, its TARGET, its EFFECT and any RESTRICTIONS. To use one: select its targets, pay its CP (if it has an optional section marked with an extra cost such as +1CP, you may only use that section by paying the extra too; you can't use a stratagem you can't afford), then resolve its effect."], ["Limits", "A stratagem can be used many times in a battle, but each player can use a given stratagem only once per phase, and (unless stated) can't target the same unit with more than one stratagem in the same phase. You can't target your own battle-shocked units with stratagems."], ["Colour key", "Blue = your turn, red = your opponent's turn, green = either player's turn."], ["Command Re-roll (1CP)", "Either turn, any phase, just after you roll an advance, charge, damage, hazard, hit, save or wound roll, or a roll for the number of attacks a weapon makes, for a friendly unit or model. Re-roll it. If several dice were rolled together, re-roll just one of them — except charge rolls, which are re-rolled in full."], ["Epic Challenge (1CP)", "Fight phase, just after a friendly Character unit is selected to fight. Pick one Character model in it: until the end of the phase its melee weapons have [Precision]."], ["Insane Bravery (1CP)", "Battle-shock step of your Command phase, just before you take a battle-shock roll for a friendly unit. That roll automatically succeeds. Only once per battle."], ["Explosives (1CP)", "Your Shooting phase. Target a friendly unengaged Explosives/Grenades unit that is eligible to shoot and didn't advance this turn. Pick one Explosives/Grenades model in it and one unengaged enemy unit within 8\" that model can see; roll six D6 and each 4+ inflicts 1 mortal wound on that enemy unit."], ["Crushing Impact (1CP)", "Your Charge phase, just after a friendly Monster/Vehicle unit finishes a charge move. Pick an enemy unit engaged with it and one of your models engaged with that unit. Roll D6 equal to that model's T: each 1 inflicts 1 mortal wound on your unit, each 5+ inflicts 1 mortal wound on the enemy unit, to a maximum of 6 mortal wounds on each unit."], ["Rapid Ingress (1CP)", "End of your opponent's Movement phase. Target one friendly unit in strategic reserves (not Aircraft); it makes an ingress move. Can't be used in the first battle round."], ["Fire Overwatch (1CP)", "End of your opponent's Movement phase. Target one friendly unengaged unit that isn't Titanic; it shoots using snap shooting."], ["Snap shooting", "Used by Fire Overwatch. Target one visible eligible enemy unit within 24\". Attacks only hit on an unmodified 6, regardless of BS or modifiers, and can't re-roll hits. Recent update: snap shooting hits can't be critical hits, so they don't trigger effects like [Sustained Hits] or [Lethal Hits]. The unit can't start an action afterwards this phase."], ["Smokescreen (1CP)", "Start of your opponent's Shooting phase. Target one friendly Smoke unit. Until the end of the phase, any attack aimed at that unit, or at a unit that isn't fully visible to the attacker because of models in that Smoke unit, gives the target the benefit of cover."], ["Heroic Intervention (1CP)", "End of your opponent's Charge phase. Target a friendly unengaged unit within 12\" of at least one enemy unit (a Vehicle only if it is also a Character or Walker). It resolves a charge. Before rolling, choose: Leap to Defend — charge targets may only be enemy units that made a charge move this phase and are within the rolled distance; or Into the Fray — any charge roll above 6 (after modifiers) becomes 6, and you may choose any enemy units within 6\" and within the rolled distance as charge targets."], ["Counteroffensive (2CP)", "Fight step of your opponent's Fight phase, just after an enemy unit finishes its attacks. Target a friendly unit eligible to fight. Until the end of the phase it has Fights First, and it must be the next unit you select to fight."]]}, {"id": "r16", "num": "16", "title": "Actions", "items": [["Performing actions", "Each action states when it STARTS, which UNITS can perform it, its USE LIMIT, when it COMPLETES, its EFFECT, and any extra restrictions. Actions come from mission packs and other publications; core actions are available to everyone, others may be limited by faction."], ["Who can start one", "A unit can't start an action if it: isn't on the battlefield; is an Aircraft or Fortification; is battle-shocked; has OC 0 or '-'; is engaged (unless it's Titanic); made an advance or fall-back move this turn; or already started an action this turn. A unit that has already shot this phase also can't start one this phase."], ["After starting", "Until the end of the turn the unit can't shoot (Titanic units can) and can't declare a charge."], ["Completing", "If the unit makes any move other than a pile-in or consolidation, or leaves the battlefield, the action isn't completed. A battle-shocked unit can't complete an action. Otherwise, when the action completes, apply its Effect."]]}, {"id": "r17", "num": "17", "title": "Monsters and Vehicles", "items": [["Movement", "When making a normal or advance move, Monster and Vehicle models may move through friendly and enemy models, except other Monster/Vehicle models."], ["Frame", "Models without a base (mostly Monsters/Vehicles) and some other large models have the Frame keyword. Unless stated otherwise, measure to and from the closest point of the model itself rather than its base. A baseless Frame model rotates about its central axis, staying upright."], ["Shooting engaged Monsters and Vehicles", "In your Shooting phase, engaged enemy Monster/Vehicle units can be chosen as targets of ranged attacks. Every such attack takes -1 to the hit roll, except attacks with [Close-Quarters] weapons made by models in a unit that is engaged with the target. [Blast] weapons still can't target them because they are engaged."], ["Shooting while engaged with them", "Being engaged with an enemy Monster/Vehicle doesn't let your unit shoot normally; your unit still needs a shooting type usable while engaged (such as close-quarters shooting) to attack it."]]}, {"id": "r18", "num": "18", "title": "Transports", "items": [["Capacity", "A Transport's datasheet lists what kind and how many friendly models can embark. Several units can be inside at once if there is room. In the Declare Battle Formations step, units may start the battle embarked in a Transport with room for the whole unit."], ["Embarking", "From the first battle round on, after a unit makes a normal, advance or fall-back move it can embark if: every model is within 3\" of the Transport; the unit wasn't set up on the battlefield this turn; the Transport's datasheet allows it; and there's room for every model. Remove it from the battlefield; it is embarked and no longer on the battlefield."], ["Disembarking", "In your Movement phase, an embarked unit may disembark with a disembark move if the Transport is on the battlefield, the unit didn't embark in it this phase, and the Transport hasn't made an advance or fall-back move this phase."], ["Disembark modes", "Pick the first applicable mode. Rapid: the Transport made a normal or ingress move this phase (mandatory). Tactical: otherwise, if the Transport remained stationary or hasn't been selected to move yet this phase, and the unit can be set up (mandatory). Combat: otherwise; make a hazard roll for every model first."], ["Disembark set-up", "Set every model up wholly within 3\" of the Transport (Rapid and Tactical) or 6\" (Combat), following the normal set-up rules. Rapid after an ingress move: models must obey the same placement restrictions the Transport did (e.g. more than 8\" from enemies, outside the enemy deployment zone). Combat: models may be set up engaged with enemy units the Transport is engaged with."], ["After disembarking", "Rapid: the unit can't declare a charge this turn. Tactical: the unit is then selected to make a normal or advance move. Combat: the unit becomes battle-shocked and can't declare a charge this turn."], ["Emergency disembark", "When a Transport is destroyed, before it is removed, each unit inside must make an emergency disembark move: make a hazard roll for every model, then set the models up wholly within 6\" of the Transport and as close to it as possible. Any model that can't be placed is destroyed. The unit then becomes battle-shocked and can't declare a charge this turn."]]}, {"id": "r19", "num": "19", "title": "Attached Units", "items": [["Forming", "Units with the Leader or Support ability (leader units and support units) can lead specific bodyguard units listed in the app. In the Muster Armies step, each such unit may join one friendly bodyguard unit it is allowed to lead. Unless stated otherwise a bodyguard unit can have at most one leader unit and one support unit. The resulting attached unit is one unit for every rule."], ["Toughness", "Attacks against an attached unit use the highest T among its bodyguard models while any remain, regardless of the leaders' T. Once only leader/support models are left, use the highest T among them."], ["Destroyed", "Rules triggered when a unit is destroyed only trigger when the last model that started the battle in the attached unit is destroyed."], ["Keywords", "The attached unit has every keyword of each of its component units, so rules affecting any of those keywords affect it (e.g. an [Anti-Psyker] weapon gets its critical wounds against the whole unit if the leader is a Psyker). Individual models don't gain keywords from other models. Attacks target units, not models."], ["Abilities", "A rule that affects one specific model (e.g. an enhancement or a wargear item) only ever affects that model. Rules that affect the unit apply to all its models until their source is destroyed: from a leader/support unit, until its last model dies; from the bodyguard unit, until its last model dies; from a specific model, until that model dies. If the source dies to an attack, the effect lasts until the attacking unit finishes all its attacks. A revived source restores the effect."], ["Leaders without bodyguards", "Leader and support units that started the battle attached still benefit from their own 'while this model is leading a unit' abilities after their bodyguard unit is destroyed."]]}, {"id": "r20", "num": "20", "title": "Strategic Reserves", "items": [["Placing", "In the Declare Battle Formations step you may put friendly units (not Fortifications) into strategic reserves instead of deploying them. Unless stated otherwise, the total points of your reserves, including units embarked in Transports that are in reserves, can't exceed half of your battle size's points limit."], ["Repositioned units", "Units removed from the battlefield into strategic reserves during the battle. If the removing rule is used in the Movement phase, it can be used on units that already moved. A repositioned unit set up in the same turn it advanced, fell back or disembarked still counts as having done so. Effects with a set duration or condition keep applying while it lasts (e.g. it stays battle-shocked if it arrives the same turn, but an aura only applies if it is in range when it arrives)."], ["Arriving", "Reserves arrive by making an ingress move, normally only from the second battle round onwards. Units embarked in a Transport that is itself in reserves can't make their own ingress move."], ["Ingress move", "Set the unit up wholly within 6\" of one or more battlefield edges and more than 8\" horizontally from every enemy unit. Before the third battle round, no model may be set up in your opponent's deployment zone. Afterwards, unless stated otherwise, the unit can't make any other type of move until the start of the next Charge phase."], ["Reserves that never arrive", "At the end of the third battle round, unless stated otherwise, every strategic reserves unit that hasn't made an ingress move is destroyed, except units embarked in a Transport that made an ingress move during the battle, and repositioned units."]]}, {"id": "r21", "num": "21", "title": "Flying and Surging", "items": [["Surge move", "A move granted by some rules; its maximum distance is set by that rule. Eligible only if the triggering rule fired, and the unit is not battle-shocked, is unengaged and hasn't moved this phase. The surge target is the closest enemy unit."], ["Surge: moving", "Each model must end engaged with the surge target if possible; any model that can't must end as close to it as possible. Afterwards the unit can't be engaged with any enemy unit other than the surge target, and it can't move again this phase."], ["Flying", "Models with the Fly keyword, and units containing them, can Fly (also called Flying models/units)."], ["Taking to the skies", "When a Flying unit is selected for a normal, advance, fall-back or charge move, before moving any model you may declare it takes to the skies. For that move: subtract 2\" from its maximum distance; vertical distance doesn't count towards distance moved; and its models can move through any models (including enemies and Monsters/Vehicles) and horizontally and vertically through all categories of terrain."]]}, {"id": "r22", "num": "22", "title": "Other Rules and Abilities", "items": [["Aura", "Abilities tagged 'Aura' affect models or units within a stated range. A model on the battlefield is always within range of its own aura. A unit can benefit from several different auras, but the same aura only applies to it once even if it is in range of it more than once."], ["Faction abilities", "Also called army rules; listed in a datasheet's Faction Abilities. Unless stated otherwise they only work if the Army Faction you chose when mustering matches one of the unit's faction keywords."], ["Psychic", "Abilities tagged 'Psychic'. Any wound lost because of a psychic ability counts as inflicted by a psychic attack, which other rules may care about."], ["Wargear abilities", "Abilities granted by a wargear item, listed under Wargear Abilities. If the unit has the item, the ability applies to the unit. If a particular model has it, that model is the bearer and the ability applies until the bearer is destroyed."], ["Plunging fire", "When a model makes a ranged attack at a visible unit that has at least one model on ground level, improve the attack's BS by 1 if the attacker is standing on a terrain section 3\" or taller, or the attacker is Towering and the target is within 12\". It never applies to attacks made by or targeting Aircraft."]]}, {"id": "r23", "num": "23", "title": "Aircraft", "items": [["Deployment", "All Aircraft units must be placed in strategic reserves in the Declare Battle Formations step."], ["Movement", "Aircraft can only make ingress moves. At the end of your opponent's turn, all of your Aircraft on the battlefield return to strategic reserves. Any unit making any move can move its models through Aircraft models. During pile-in, consolidation and surge moves, units that can't Fly ignore Aircraft when selecting enemy units and working out the closest enemy unit. Being engaged only with Aircraft doesn't stop a unit from making normal or advance moves."], ["Shooting", "Plunging Fire doesn't apply to attacks by or against Aircraft."], ["Charging and fighting", "Aircraft can't declare charges and can only make melee attacks against Flying units. Only Flying units may pick Aircraft as charge targets, and only Flying models may make melee attacks against Aircraft."]]}, {"id": "r24", "num": "24", "title": "Core Abilities", "items": [["Abilities", "Core abilities appear on datasheets and weapon abilities in weapon profiles, shown in square brackets (e.g. [Blast]). A weapon is often called by an ability it has ('a [Blast] weapon')."], ["Keyword-limited abilities", "When a weapon ability is followed by one or more keywords, it only applies when attacking a unit that has at least one of those keywords. E.g. [Lethal Hits: Vehicle] only works against Vehicle units; [Sustained Hits 1: Infantry/Beasts] only against Infantry or Beasts units."], ["Duplicates", "Multiple copies of the same core ability or weapon ability never stack, even if their numbers or keywords differ (e.g. [Sustained Hits 1] and [Sustained Hits 2], or [Anti-Vehicle 4+] and [Anti-Infantry 2+]); the controlling player picks which one applies. For weapon abilities this choice is made each time the unit attacks, in the Select Weapons step. Exception for Scouts: use the lowest value that isn't shared by every model (e.g. one model with Scouts 6\" and five with Scouts 8\" must use 6\"; if all have both, 8\" can be chosen)."], ["[Anti-X Y+]", "Against a target unit with keyword X, an unmodified wound roll of Y or higher is a critical wound (e.g. [Anti-Vehicle 4+] crits on 4+ against Vehicles)."], ["[Assault]", "A unit with at least one model carrying an [Assault] weapon can use assault shooting after advancing (only [Assault] weapons fire)."], ["[Blast] / [Blast X]", "When gathering attack dice, add 1 extra attack dice (or X for [Blast X]) for every full five models in the target unit at the Select Targets step, rounding down. E.g. [Blast 2], A 3, vs 12 models: 4 extra, 7 total. [Blast] weapons can never target engaged units (including engaged Monsters/Vehicles), even during close-quarters shooting."], ["[Cleave X]", "When gathering attack dice, if every attack of this weapon is aimed at one single target, add X attack dice for every full five models in that unit at the Select Targets step (round down). E.g. [Cleave 1], A 3, vs 16 models: 3 extra, 6 total."], ["[Close-Quarters] / [Pistol]", "A unit with a model carrying a [Close-Quarters] weapon can use close-quarters shooting. When the unit uses any other shooting type, each model that isn't a Monster/Vehicle must choose to fire either one or more of its [Close-Quarters] weapons or one or more of its other ranged weapons, not both. [Pistol] is identical to [Close-Quarters] in every way (it is the older name)."], ["Deadly Demise X", "Each time a model in this unit is destroyed, after any units inside it make their emergency disembark moves (and after the attacking unit finishes its attacks), roll a D6 before removing it. On a 6, every unit within 6\" of it suffers X mortal wounds (if X is random, roll separately for each unit)."], ["Deep Strike", "If every model in the unit has it, when it makes an ingress move it may be set up anywhere on the battlefield more than 8\" horizontally from all enemy units, even inside your opponent's deployment zone (instead of near a battlefield edge)."], ["[Devastating Wounds]", "When an attack with this weapon scores a critical wound, its attack sequence ends (no save) and the target suffers mortal wounds equal to the weapon's D, applied after any normal damage from those attacks. These mortal wounds can damage at most one model per critical wound; any excess from that attack is lost."], ["[Extra Attacks]", "When the unit fights, models with these weapons attack with them in addition to their other weapons: in Select Weapons, choose all of the model's [Extra Attacks] weapons plus one of its other melee weapons, if it has one."], ["Feel No Pain X+", "Each time a model with this would lose a wound (from any source, including mortal wounds), roll a D6; on X or higher that wound isn't lost."], ["Fights First", "If every model in a unit has this, it is a Fights First unit and is selected in the Fights First step of the Fight phase. Units that made a charge move gain it until end of turn."], ["Firing Deck X", "In your Shooting phase, when this Transport is selected to shoot with units embarked: pick up to X embarked models whose units haven't been selected to shoot this phase; pick one ranged weapon each (not [One Shot]); the Transport has those weapons in addition to its own until it finishes its attacks. The embarked units can't shoot for the rest of the turn."], ["[Hazardous]", "After the unit finishes all its attacks when shooting or fighting, make one hazard roll for the unit per [Hazardous] weapon you selected in the Select Weapons step."], ["[Heavy]", "In your Shooting phase, add 1 to the hit roll for attacks with this weapon if the attacking unit is unengaged, wasn't set up on the battlefield this turn, and none of its models has moved more than 3\" this turn."], ["Hover", "When this unit takes to the skies, don't subtract 2\" from the maximum distance."], ["[Ignores Cover]", "The target can't have the benefit of cover against attacks with this weapon, including cover granted by rules such as Stealth or Smokescreen."], ["[Indirect Fire]", "A unit with a model carrying an [Indirect Fire] weapon can use indirect shooting (can target non-visible units; target always gets cover; no hit re-rolls; unmodified 1-5 fails, or 1-3 if the unit stayed stationary and a friendly unit can see the target)."], ["Infiltrators", "During deployment, if every model in the unit has this, it can be set up anywhere on the battlefield more than 8\" horizontally from your opponent's deployment zone and from all enemy units."], ["[Lance]", "Add 1 to the wound roll for attacks with this weapon if the attacking model's unit made a charge move this turn."], ["Leader / Support", "Lets the unit join a bodyguard unit to form an attached unit; see Attached Units. Leader and Support are separate abilities: a bodyguard can have one of each."], ["[Lethal Hits]", "When an attack with this weapon scores a critical hit, you may have it wound automatically. If you do, no wound roll is made, so it can't become a critical wound and can't trigger things like [Devastating Wounds]."], ["Lone Operative (X\")", "Unless it is part of an attached unit, this unit isn't visible to enemy models more than 12\" away (or X\" for Lone Operative X\"), and [Indirect Fire] weapons can't target it unless the attacker is within that distance."], ["[Melta X]", "If the target was within half the weapon's range at the Select Targets step, add X to the weapon's D until the attacking unit finis   for(const[n,st]of Object.entries(en))if(st.size>1)w.push(`${n} is in both armies. Enhancements and Upgrades can't appear in both armies.`);
  const war=kids.flatMap(k=>(k.entries||[]).filter(e=>e.warlord).map(e=>({k,e})));
  if(kids.some(k=>(k.entries||[]).length)&&war.length!==1)w.push(war.length?'Only one Warlord is allowed across the force.':"Choose the force's Warlord.");
  const disps=[...new Set(cs.flatMap(c=>dispositionsFor(c.dets)))];
  if(cs.some(c=>c.dets.length)&&!d.disposition)w.push('Choose a Force Disposition for the force.');
  const unified=kids.length===2&&kids[0].faction===kids[1].faction;
  return{kids,cs,pts,w,disps,unified,war}}

/* ---------- rendering ---------- */
function requestRender(){const a=document.activeElement;if(a&&a.closest('#app,#sheet')&&/^(INPUT|TEXTAREA)$/.test(a.tagName)){S.pending=true;return}render()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.pending){S.pending=false;requestRender()}},0));

function render(){
  const v=S.view;
  const html=v==='lists'?vLists():v==='dbl'?vDbl():v==='list'?vList():v==='play'?vPlay():v==='playpick'?vPlayPick():
    v==='codex'?vCodex():v==='det'?vDet():v==='unit'?vUnit():v==='core'?vCore():v==='limits'?vSettings():v==='io'?vIO():
    v==='rules'?vRules():v==='settings'?vAppSettings():v==='udata'?vUData():v==='ddata'?vDData():'';
  const ctx=v==='list'?S.lists[S.listId]?.faction:v==='play'?S.lists[S.playId]?.faction:['det','unit'].includes(v)?S.draft?.faction:v==='codex'?S.cfac:v==='udata'?S.units[S.viewId]?.faction:v==='ddata'?S.dets[S.viewId]?.faction:'';
  document.body.className=ctx?'f-'+ctx:'';

  const tab=['lists','list','dbl'].includes(v)?'lists':['play','playpick'].includes(v)?'play':['rules','core'].includes(v)?'rules':v==='settings'?'settings':'codex';
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button data-a="tab" data-k="${k}" ${tab===k?'aria-current="page"':''} aria-label="${l}">${ICONS[k]}<span>${l}</span></button>`).join('');

}

      ${pool.length?(()=>{const cur=pool.find(x=>x.key===e.enhId);const lab=r.character?'Enhancement':'Upgrade';return `<details class="gear enhp" data-gid="enh-${e.id}" ${S.gearOpen['enh-'+e.id]?'open':''}><summary class="small">${lab} · ${cur?`<b class="modt">${h(cur.name)}</b>`:'none'}</summary><div class="radios" style="margin-top:8px">
